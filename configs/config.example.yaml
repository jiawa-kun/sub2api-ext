# Sub2API 扩展 sidecar 配置示例（产品 sub2api-ext / 兼容 sub2api-ext）
server:
  # 监听地址
  addr: ":8090"
  # 对外访问前缀（生产反代到 /ext 时设 base_path: /ext 或 SERVER_BASE_PATH=/ext）
  base_path: ""

checkin:
  # 是否开放签到
  enabled: true
  # 每日奖励金额（与 sub2api 余额单位一致，通常为美元）
  reward_amount: 0.1
  # 自然日切分时区
  timezone: "Asia/Shanghai"
  # 写到 sub2api 调账备注里的前缀
  notes_prefix: "daily-checkin"

patrol:
  # 是否启用定时巡检（也可在管理页热更新）
  enabled: false
  # 5 段 cron：分 时 日 月 周
  cron: "0 */6 * * *"
  # 要巡检的账号分组（必填才会实际跑）
  groups: []
  # 固定测试模型；留空则测账号 model_mapping 全部 key
  test_model: "gpt-5.4"
  concurrency: 8
  timeout_ms: 45000
  # disable | delete | none
  action_on_fail: "disable"
  # 连续失败达到该次数才执行 action_on_fail（1..10）
  # 1 = 一次失败即处置（旧行为）；建议 2，可避免上游抖动误杀账号
  fail_threshold: 1
  only_schedulable: false
  stop_on_first_model_failure: true
  prompt: "hi"
  auto_enable_on_success: true
  timezone: "Asia/Shanghai"
  keep_runs: 50

notify:
  # 是否启用通知（也可在管理页热更新）
  enabled: false
  # webhook | wecom | telegram
  channel: "webhook"
  # Webhook 地址；channel=telegram 时填 bot token
  target: ""
  # channel=telegram 时填 chat id
  extra: ""
  # 作为 Authorization: Bearer 发送，可留空
  secret: ""
  # 留空表示订阅全部事件
  events: []
  # info | warn | error
  min_level: "warn"

lottery:
  # 是否启用抽奖（也可在管理页热更新；默认关闭）
  enabled: false
  # 是否要求先完成当日签到
  require_checkin: true
  # 日预算；0 表示不限制
  daily_budget: 0
  # 单次上限；0 表示不钳制
  hard_cap: 0
  # 奖池可留空，启动时使用内置默认奖池
  prizes: []

report:
  # 是否启用运营日报（也可在管理页热更新；默认关闭）
  enabled: false
  # 本地发送时间 HH:MM
  send_at: "09:00"
  timezone: "Asia/Shanghai"
  # yesterday | today
  cover_day: "yesterday"
  # 留空表示全部：checkin / lottery / patrol
  sections: []

sub2api:
  # sub2api 根地址，不要带尾斜杠
  base_url: "https://sub2api.example.com"
  # public_host: your-sub2api.example.com
  # Admin JWT 或能调用 /api/v1/admin/* 的 Bearer Token
  # 也可用环境变量 SUB2API_ADMIN_TOKEN 覆盖
  admin_token: ""
  # HTTP 超时（秒）
  timeout_seconds: 15

store:
  # SQLite 路径（Docker 请挂卷）
  sqlite_path: "./data/checkin.db"

security:
  # AI 创作用户 API Key 的服务端加密密钥，生产环境至少 32 个随机字符。
  # 设置后不要随意更换，否则已有用户 Key 将无法解密。
  creative_credential_secret: ""
