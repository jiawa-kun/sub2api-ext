# Sub2API 扩展 sidecar 配置示例（产品 sub2api-ext / 兼容 sub2api-ext）
server:
  # 监听地址
  addr: ":8090"
  # 对外访问前缀（若反代到 /checkin，可设 base_path: /checkin）
  base_path: ""

checkin:
  # 是否开放签到
  enabled: true
  # 每日奖励金额（与 sub2api 余额单位一致，通常为美元）
  reward_amount: 0.1
  # 自然日切分时区
  timezone: "Asia/Shanghai"
  # 写到 sub2api 调账备注里的前缀
  notes_prefix: "daily-checkin"

patrol:
  # 是否启用定时巡检（也可在管理页热更新）
  enabled: false
  # 5 段 cron：分 时 日 月 周
  cron: "0 */6 * * *"
  # 要巡检的账号分组（必填才会实际跑）
  groups: []
  # 固定测试模型；留空则测账号 model_mapping 全部 key
  test_model: "gpt-5.4"
  concurrency: 8
  timeout_ms: 45000
  # disable | delete | none
  action_on_fail: "disable"
  only_schedulable: false
  stop_on_first_model_failure: true
  prompt: "hi"
  auto_enable_on_success: true
  timezone: "Asia/Shanghai"
  keep_runs: 50

sub2api:
  # sub2api 根地址，不要带尾斜杠
  base_url: "https://sub2api.example.com"
  # public_host: your-sub2api.example.com
  # Admin JWT 或能调用 /api/v1/admin/* 的 Bearer Token
  # 也可用环境变量 SUB2API_ADMIN_TOKEN 覆盖
  admin_token: ""
  # HTTP 超时（秒）
  timeout_seconds: 15

store:
  # SQLite 路径（Docker 请挂卷）
  sqlite_path: "./data/checkin.db"
