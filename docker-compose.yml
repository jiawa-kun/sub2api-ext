# Sub2API 扩展服务
# 默认从 GitHub Container Registry 拉镜像：
#   ghcr.io/jiawa-kun/sub2api-ext:latest
# 可用环境变量覆盖：
#   IMAGE=ghcr.io/jiawa-kun/sub2api-ext:sha-xxxx
services:
  ext:
    image: ${IMAGE:-ghcr.io/jiawa-kun/sub2api-ext:latest}
    container_name: sub2api-ext
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      SERVER_ADDR: ":8090"
      SERVER_BASE_PATH: "/ext"
      CHECKIN_ENABLED: "${CHECKIN_ENABLED:-true}"
      CHECKIN_REWARD_AMOUNT: "${CHECKIN_REWARD_AMOUNT:-0.1}"
      CHECKIN_TIMEZONE: "${CHECKIN_TIMEZONE:-Asia/Shanghai}"
      SUB2API_BASE_URL: "${SUB2API_BASE_URL:-http://sub2api:8080}"
      SUB2API_PUBLIC_HOST: "${SUB2API_PUBLIC_HOST:-}"
      SUB2API_ADMIN_API_KEY: "${SUB2API_ADMIN_API_KEY:-}"
      SUB2API_ADMIN_TOKEN: "${SUB2API_ADMIN_TOKEN:-}"
      SQLITE_PATH: "/data/checkin.db"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    networks:
      - default
      - sub2api-net

networks:
  sub2api-net:
    external: true
    name: sub2api-deploy_sub2api-network
