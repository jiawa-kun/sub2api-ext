server {
    server_name your-sub2api.example.com your-sub2api-alt.example.com;
    client_max_body_size 256m;

    # sub2api-ext 扩展服务（必须写在 location / 之前）
    location /ext/ {
        proxy_pass http://127.0.0.1:8090/ext/;
        proxy_http_version 1.1;

        # 关键：把登录头完整转给签到服务（部分环境默认会丢 Authorization）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Token $http_x_user_token;
        proxy_pass_request_headers on;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 避免 iframe 被屏蔽
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' https://your-sub2api.example.com https://your-sub2api-alt.example.com" always;
    }

    location = /ext {
        return 301 /ext/;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/your-sub2api.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/your-sub2api.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = your-sub2api.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = your-sub2api-alt.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name your-sub2api.example.com your-sub2api-alt.example.com;
    return 404; # managed by Certbot
}
