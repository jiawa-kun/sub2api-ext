    :root{--bg:var(--app-bg);--surface:var(--app-surface);--raised:var(--app-surface-raised);--soft:var(--app-surface-soft);--text:var(--app-text);--muted:var(--app-muted);--border:var(--app-border);--strong:var(--app-border-strong);--primary:var(--app-primary);--success:var(--app-success);--warning:var(--app-warning);--danger:var(--app-danger);--radius:var(--app-radius);--shadow:var(--app-shadow)}
    .works-wrap{display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.topnav{display:flex;flex-wrap:wrap}.topnav .nav-extra{display:none}.topnav a svg{width:14px;height:14px;flex:none}.brand-title,.top-meta{display:flex;align-items:center}.brand-title .logo.light{display:none}html.light .brand-title .logo.dark{display:none}html.light .brand-title .logo.light{display:block}.top-meta{gap:8px}.balance-badge{min-height:36px;display:flex;align-items:center;padding:0 11px;border:1px solid var(--border);border-radius:var(--app-radius-sm);background:var(--soft);font-size:.76rem;font-weight:700;white-space:nowrap}
    .library-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0}.library-summary{color:var(--muted);font-size:.76rem}.library-actions{display:flex;align-items:center;gap:8px}.filter-tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:var(--app-radius-sm);background:var(--soft)}.filter-tabs .tab{min-height:34px;padding:5px 12px;border:1px solid transparent;border-radius:var(--app-radius-sm);background:transparent;color:var(--muted);box-shadow:none}.filter-tabs .tab.active{border-color:var(--border);background:var(--surface);color:var(--text)}
    .works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-width:0}.work{min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}.work-media{position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--soft);color:var(--muted);font-size:.76rem}.media-button{width:100%;height:100%;min-height:0!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:inherit!important;box-shadow:none!important;cursor:pointer}.media-button img,.media-button video{width:100%;height:100%;display:block;object-fit:contain;background:#05070b}.media-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;padding:24px;color:var(--muted)}.media-placeholder svg{width:28px;height:28px}.work-status,.work-count{position:absolute;top:9px;z-index:2;padding:4px 7px;border:1px solid var(--border);border-radius:var(--app-radius-sm);background:color-mix(in srgb,var(--surface) 92%,transparent);font-size:.66rem;font-weight:700;pointer-events:none}.work-status{left:9px}.work-count{right:9px;color:var(--muted)}.work-status.completed{color:var(--success)}.work-status.processing,.work-status.created{color:var(--warning)}.work-status.failed,.work-status.refunded{color:var(--danger)}.progress-track{position:absolute;left:14%;right:14%;bottom:20px;height:4px;overflow:hidden;border-radius:3px;background:var(--border)}.progress-track i{display:block;height:100%;background:var(--primary)}.work-body{padding:13px}.work-title{min-height:40px;display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--text);font-size:.84rem;font-weight:700;line-height:1.45;overflow-wrap:anywhere}.work-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;color:var(--muted);font-size:.69rem}.work-meta span{padding-right:6px;border-right:1px solid var(--border)}.work-meta span:last-child{border-right:0}.work-actions{display:flex;align-items:center;gap:7px;margin-top:11px}.work-actions button{min-height:32px;padding:5px 10px;font-size:.7rem}.work-actions .delete-work{margin-left:auto;color:var(--danger)}.work-error{margin-top:9px;color:var(--danger);font-size:.7rem;line-height:1.45;overflow-wrap:anywhere}.empty-state{grid-column:1/-1;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed var(--strong);border-radius:var(--radius);color:var(--muted);text-align:center}.empty-state svg{width:36px;height:36px;margin-bottom:12px}.empty-state strong{color:var(--text);font-size:.88rem}.empty-state span{margin-top:5px;font-size:.74rem}.message{display:none;margin:4px 0 0;padding:10px 12px;border:1px solid var(--border);border-radius:var(--app-radius-sm);font-size:.76rem}.message.show{display:block}.message.err{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}
    .pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-top:4px}.page-info{min-width:120px;color:var(--muted);font-size:.74rem;text-align:center}.pagination button{min-width:72px}
    .viewer{width:min(1120px,calc(100vw - 32px));height:min(860px,calc(100vh - 32px));max-width:none;max-height:none;padding:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,.45)}.viewer::backdrop{background:rgba(3,7,18,.78)}.viewer-shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.viewer-head,.viewer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}.viewer-head{border-bottom:1px solid var(--border)}.viewer-foot{border-top:1px solid var(--border)}.viewer-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.82rem;font-weight:700}.viewer-close{width:36px;height:36px;min-height:36px!important;padding:0!important}.viewer-media{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#05070b}.viewer-media img,.viewer-media video{max-width:100%;max-height:100%;object-fit:contain}.viewer-nav{display:flex;align-items:center;gap:8px}.viewer-index{min-width:72px;color:var(--muted);font-size:.72rem;text-align:center}.hidden{display:none!important}
    @media(max-width:1080px){.works{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:760px){body.app-works{padding:12px 10px 32px}.top{flex-direction:column}.top-meta{width:100%;justify-content:space-between}.library-toolbar{align-items:flex-start;flex-direction:column}.library-actions{width:100%;justify-content:space-between}.filter-tabs{flex:1}.filter-tabs .tab{flex:1}.viewer{width:calc(100vw - 16px);height:calc(100vh - 16px)}.viewer-foot{align-items:stretch;flex-direction:column}.viewer-nav{justify-content:space-between}}
    @media(max-width:560px){.works{grid-template-columns:minmax(0,1fr)}.pagination{justify-content:space-between}.page-info{min-width:0}.work-media{aspect-ratio:1/1}}

<script>
const AUTH_KEYS=['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];
const PAGE_SIZE=10;
const state={token:'',filter:'',page:1,total:0,jobs:[],pollTimer:0,urls:new Map(),posters:new Map(),posterLoading:new Set(),viewerJob:null,viewerIndex:0,posterQueue:[],posterActive:0};
const $=id=>document.getElementById(id);
function cleanToken(v){v=(v||'').trim().replace(/^bearer\s+/i,'');return v.replace(/^["']|["']$/g,'')}
function findToken(){const q=cleanToken(new URLSearchParams(location.search).get('token'));if(q)return q;for(const k of AUTH_KEYS){try{const v=cleanToken(localStorage.getItem(k));if(v)return v}catch{}try{if(parent!==window){const v=cleanToken(parent.localStorage.getItem(k));if(v)return v}}catch{}}return ''}
function headers(json=true){const h={};if(state.token)h.Authorization='Bearer '+state.token;if(json)h['Content-Type']='application/json';return h}
async function api(path,opt={}){const response=await fetch(path,{...opt,headers:{...headers(opt.json!==false),...(opt.headers||{})}});const contentType=response.headers.get('content-type')||'';const data=contentType.includes('json')?await response.json():await response.text();if(!response.ok)throw new Error((data&&data.error)||data||('HTTP '+response.status));return data}
function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '$'+Number(v||0).toFixed(4)}
function showMessage(text){const node=$('message');node.textContent=text;node.className=text?'message show err':'message'}
function statusText(value){return ({created:'排队中',processing:'生成中',completed:'已完成',failed:'生成失败',refunded:'失败已退款'})[value]||value||'—'}
function dateText(value){const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function friendlyError(value){const text=String(value||'');if(/generated video rejected by content moderation/i.test(text))return '视频未通过内容安全审核，请调整提示词或参考图后重试';if(/image generation is not enabled for this group/i.test(text))return '当前 API Key 所属分组未开启图片生成功能';return text}
function workAmount(job){if(job.charge_status==='upstream')return '预计 '+money(job.charge_amount);if(job.charge_status==='refunded')return money(job.charge_amount)+' · 已退款';if(job.charge_status==='refund_pending')return money(job.charge_amount)+' · 退款中';return money(job.charge_amount)}
function terminal(job){return !['created','processing'].includes(job.status)&&job.charge_status!=='refund_pending'}
function streamURL(job,index=0){const query=new URLSearchParams({index:String(index)});if(state.token)query.set('token',state.token);return `./api/creative/jobs/${job.id}/content?${query.toString()}`}
function videoPlayOverlay(){return '<span class="video-play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 7.5v9l7-4.5-7-4.5z"/></svg></span>'}
function mediaPlaceholder(job){if(job.status==='completed'&&job.media_type==='image')return '<div class="media-placeholder"><span>正在加载预览…</span></div>';if(job.status==='completed'){const poster=state.posters.get(Number(job.id));if(poster)return `<img class="video-poster" src="${poster}" alt="${escapeHTML(job.prompt||'视频封面')}"/>${videoPlayOverlay()}`;if(poster===false)return '<div class="media-placeholder video-preview-unavailable"><span>预览不可用，点击播放</span></div>'+videoPlayOverlay();return '<div class="media-placeholder video-preview-pending"><span>正在提取视频封面…</span></div>'+videoPlayOverlay()}return `<div class="media-placeholder"><span>${escapeHTML(statusText(job.status))}</span>${job.status==='processing'?`<div class="progress-track"><i style="width:${Math.max(2,Math.min(100,Number(job.progress||0)))}%"></i></div>`:''}</div>`}
function workCard(job){const count=job.media_type==='image'?Math.max(1,Number(job.content_count||1)):1,canOpen=job.status==='completed';return `<article class="work" data-job-id="${job.id}"><div class="work-media"><span class="work-status ${escapeHTML(job.status)}">${escapeHTML(statusText(job.status))}</span>${count>1?`<span class="work-count">${count} 张</span>`:''}${canOpen?`<button type="button" class="media-button" data-view="${job.id}" aria-label="查看作品">${mediaPlaceholder(job)}</button>`:mediaPlaceholder(job)}</div><div class="work-body"><div class="work-title" title="${escapeHTML(job.prompt)}">${escapeHTML(job.prompt||job.model_id)}</div><div class="work-meta"><span>${escapeHTML(job.model_id)}</span><span>${escapeHTML(workAmount(job))}</span><span>${escapeHTML(dateText(job.created_at))}</span></div><div class="work-actions">${canOpen?`<button type="button" data-view="${job.id}">${job.media_type==='video'?'播放':'查看'}</button><button type="button" class="secondary" data-download="${job.id}">下载</button>`:''}${terminal(job)?`<button type="button" class="secondary delete-work" data-delete="${job.id}">删除</button>`:''}</div>${job.error_message?`<div class="work-error">${escapeHTML(friendlyError(job.error_message))}</div>`:''}</div></article>`}
function createVideoPoster(job){return new Promise((resolve,reject)=>{const video=document.createElement('video');let settled=false,capturing=false,seekRequested=false;const timeout=setTimeout(()=>finish(null,new Error('视频封面提取超时')),15000);function cleanup(){clearTimeout(timeout);video.pause();video.removeAttribute('src');video.load()}function finish(url,error){if(settled)return;settled=true;cleanup();if(error)reject(error);else resolve(url)}function capture(){if(settled||capturing||video.readyState<2||!video.videoWidth||!video.videoHeight)return;capturing=true;const scale=Math.min(1,640/video.videoWidth),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));const context=canvas.getContext('2d');if(!context){finish(null,new Error('浏览器不支持封面提取'));return}context.drawImage(video,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>blob?finish(URL.createObjectURL(blob)):finish(null,new Error('视频封面生成失败')),'image/jpeg',.84)}video.preload='auto';video.muted=true;video.playsInline=true;video.addEventListener('loadedmetadata',()=>{const duration=Number(video.duration);if(Number.isFinite(duration)&&duration>.1){const target=Math.min(1,Math.max(.25,duration*.08),Math.max(.05,duration-.05));seekRequested=target>.01;if(seekRequested){try{video.currentTime=target}catch{seekRequested=false}}if(!seekRequested&&video.readyState>=2)capture()}},{once:true});video.addEventListener('loadeddata',()=>{if(!seekRequested)capture()});video.addEventListener('seeked',capture,{once:true});video.addEventListener('error',()=>finish(null,new Error('视频预览加载失败')),{once:true});video.src=streamURL(job,0);video.load()})}
function applyVideoPoster(job,url){const button=document.querySelector(`[data-job-id="${job.id}"] .media-button`);if(!button){if(url)URL.revokeObjectURL(url);return}const id=Number(job.id),old=state.posters.get(id);if(old)URL.revokeObjectURL(old);state.posters.set(id,url||false);if(url)button.innerHTML=`<img class="video-poster" src="${url}" alt="${escapeHTML(job.prompt||'视频封面')}"/>${videoPlayOverlay()}`;else button.innerHTML='<div class="media-placeholder video-preview-unavailable"><span>预览不可用，点击播放</span></div>'+videoPlayOverlay()}
function pumpVideoPosters(){while(state.posterActive<2&&state.posterQueue.length){const job=state.posterQueue.shift(),id=Number(job.id);if(state.posters.has(id)||state.posterLoading.has(id))continue;state.posterActive++;state.posterLoading.add(id);createVideoPoster(job).then(url=>applyVideoPoster(job,url)).catch(()=>applyVideoPoster(job,'')).finally(()=>{state.posterActive--;state.posterLoading.delete(id);pumpVideoPosters()})}}
function queueVideoPosters(jobs){state.posterQueue=jobs.filter(job=>!state.posters.has(Number(job.id))&&!state.posterLoading.has(Number(job.id)));pumpVideoPosters()}
function syncPosterCache(jobs){const keep=new Set(jobs.filter(job=>job.status==='completed'&&job.media_type==='video').map(job=>Number(job.id)));for(const [id,url] of state.posters){if(keep.has(id))continue;if(url)URL.revokeObjectURL(url);state.posters.delete(id)}}
function renderWorks(){syncPosterCache(state.jobs);if(!state.jobs.length){state.posterQueue=[];$('works').innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><strong>暂无作品</strong><span>完成创作后会显示在这里</span></div>';return}$('works').innerHTML=state.jobs.map(workCard).join('');queueVideoPosters(state.jobs.filter(job=>job.status==='completed'&&job.media_type==='video'));state.jobs.filter(job=>job.status==='completed'&&job.media_type==='image').forEach(job=>loadPreview(job).catch(()=>{}))}
function clearURLs(){for(const url of state.urls.values())URL.revokeObjectURL(url);state.urls.clear()}
function clearPosterURLs(){for(const url of state.posters.values())if(url)URL.revokeObjectURL(url);state.posters.clear()}
function closeViewer(){if($('viewer').open)$('viewer').close();state.viewerJob=null;state.viewerIndex=0;$('viewerMedia').innerHTML=''}
async function contentURL(job,index=0){const key=job.id+':'+index;if(state.urls.has(key))return state.urls.get(key);const response=await fetch(streamURL(job,index),{headers:headers(false)});if(!response.ok){const contentType=response.headers.get('content-type')||'';const data=contentType.includes('json')?await response.json():await response.text();throw new Error((data&&data.error)||data||('HTTP '+response.status))}const url=URL.createObjectURL(await response.blob());state.urls.set(key,url);return url}
async function loadPreview(job){const url=await contentURL(job,0),button=document.querySelector(`[data-job-id="${job.id}"] .media-button`);if(!button)return;button.innerHTML=`<img src="${url}" alt="${escapeHTML(job.prompt||'生成图片')}" />`}
async function loadWorks(force=false){clearTimeout(state.pollTimer);if($('viewer').open){if(force)closeViewer();else{state.pollTimer=setTimeout(()=>loadWorks().catch(error=>showMessage(error.message)),5000);return}}if(force){state.posterQueue=[];clearPosterURLs()}showMessage('');const query=new URLSearchParams({page:String(state.page),page_size:String(PAGE_SIZE)});if(state.filter)query.set('type',state.filter);const data=await api('./api/creative/jobs?'+query.toString());state.jobs=Array.isArray(data.items)?data.items:[];state.total=Number(data.total||0);const pages=Math.max(1,Math.ceil(state.total/PAGE_SIZE));if(state.page>pages){state.page=pages;return loadWorks(force)}clearURLs();renderWorks();const from=state.total?(state.page-1)*PAGE_SIZE+1:0,to=Math.min(state.page*PAGE_SIZE,state.total);$('workSummary').textContent=`第 ${from}-${to} 条 / 共 ${state.total} 条`;$('pageInfo').textContent=`第 ${state.page} / ${pages} 页`;$('prevPage').disabled=state.page<=1;$('nextPage').disabled=state.page>=pages;if(state.jobs.some(job=>job.status==='processing'||job.status==='created'))state.pollTimer=setTimeout(()=>loadWorks().catch(error=>showMessage(error.message)),5000)}
function findJob(id){return state.jobs.find(job=>Number(job.id)===Number(id))}
async function openViewer(id,index=0){const job=findJob(id);if(!job||job.status!=='completed')return;state.viewerJob=job;state.viewerIndex=Math.max(0,Math.min(Number(job.content_count||1)-1,index));$('viewerTitle').textContent=job.prompt||job.model_id;$('viewerMedia').innerHTML='<span>加载中…</span>';$('viewer').showModal();await renderViewer()}
async function renderViewer(){const job=state.viewerJob;if(!job)return;const count=job.media_type==='image'?Math.max(1,Number(job.content_count||1)):1,index=Math.max(0,Math.min(count-1,state.viewerIndex));state.viewerIndex=index;$('viewerIndex').textContent=`${index+1} / ${count}`;$('viewerPrev').classList.toggle('hidden',count<=1);$('viewerNext').classList.toggle('hidden',count<=1);$('viewerPrev').disabled=index<=0;$('viewerNext').disabled=index>=count-1;try{if(job.media_type==='video'){$('viewerMedia').innerHTML=`<video src="${escapeHTML(streamURL(job,index))}" controls autoplay playsinline preload="auto" controlslist="nodownload noremoteplayback" disablepictureinpicture></video>`;return}const url=await contentURL(job,index);$('viewerMedia').innerHTML=`<img src="${url}" alt="${escapeHTML(job.prompt||'生成图片')}" />`}catch(error){$('viewerMedia').textContent=error.message}}
async function downloadWork(id,index=0){const job=findJob(id);if(!job)return;const url=job.media_type==='video'?streamURL(job,index):await contentURL(job,index),link=document.createElement('a');link.href=url;link.download=`creative-${job.id}-${index+1}.${job.media_type==='video'?'mp4':'png'}`;link.click()}
async function deleteWork(id){const job=findJob(id);if(!job||!terminal(job))return;if(!confirm('确定从“我的作品”中删除这条记录吗？'))return;await api(`./api/creative/jobs/${id}`,{method:'DELETE'});if(state.viewerJob&&Number(state.viewerJob.id)===Number(id))closeViewer();if(state.jobs.length===1&&state.page>1)state.page--;await loadWorks(true)}
async function loadStatus(){const data=await api('./api/status');$('balanceBadge').textContent='余额 '+money(data.balance);document.querySelectorAll('.topnav a.nav-extra').forEach(a=>a.style.display=data.is_admin?'inline-flex':'none')}
function initTheme(){let light=false;try{light=(localStorage.getItem('sub2api_ext_theme')||'')==='light'}catch{}document.documentElement.classList.toggle('light',light);$('themeBtn').textContent=light?'深色':'浅色';$('favicon').href=light?'./assets/ext-center-icon-light.svg':'./assets/ext-center-icon.svg'}
function focusActiveNav(){if(!matchMedia('(max-width: 860px)').matches)return;document.querySelector('.topnav a.active')?.scrollIntoView({block:'nearest',inline:'center'})}
function wireInternalLinks(){document.querySelectorAll('a[href^="./"]').forEach(link=>link.addEventListener('click',event=>{if(!state.token)return;const href=link.getAttribute('href')||'';if(href.includes('token='))return;event.preventDefault();const target=new URL(href,location.href);target.searchParams.set('token',state.token);location.href=target.pathname+target.search+target.hash}))}
$('themeBtn').onclick=()=>{const light=!document.documentElement.classList.contains('light');document.documentElement.classList.toggle('light',light);$('themeBtn').textContent=light?'深色':'浅色';$('favicon').href=light?'./assets/ext-center-icon-light.svg':'./assets/ext-center-icon.svg';try{localStorage.setItem('sub2api_ext_theme',light?'light':'dark')}catch{}};
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{state.filter=button.dataset.filter;state.page=1;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===button));loadWorks(true).catch(error=>showMessage(error.message))});$('refreshWorks').onclick=()=>loadWorks(true).catch(error=>showMessage(error.message));$('prevPage').onclick=()=>{if(state.page>1){state.page--;loadWorks(true).catch(error=>showMessage(error.message))}};$('nextPage').onclick=()=>{if(state.page*PAGE_SIZE<state.total){state.page++;loadWorks(true).catch(error=>showMessage(error.message))}};$('works').onclick=event=>{const view=event.target.closest('[data-view]'),download=event.target.closest('[data-download]'),remove=event.target.closest('[data-delete]');if(view)openViewer(Number(view.dataset.view)).catch(error=>showMessage(error.message));else if(download)downloadWork(Number(download.dataset.download)).catch(error=>showMessage(error.message));else if(remove)deleteWork(Number(remove.dataset.delete)).catch(error=>showMessage(error.message))};$('closeViewer').onclick=closeViewer;$('viewerPrev').onclick=()=>{state.viewerIndex--;renderViewer()};$('viewerNext').onclick=()=>{state.viewerIndex++;renderViewer()};$('viewerDownload').onclick=()=>state.viewerJob&&downloadWork(state.viewerJob.id,state.viewerIndex).catch(error=>showMessage(error.message));$('viewer').onclick=event=>{if(event.target===$('viewer'))closeViewer()};$('viewer').addEventListener('close',()=>{state.viewerJob=null;state.viewerIndex=0;$('viewerMedia').innerHTML=''});window.addEventListener('beforeunload',()=>{clearURLs();clearPosterURLs()});
initTheme();state.token=findToken();wireInternalLinks();requestAnimationFrame(focusActiveNav);if(!state.token){showMessage('请先登录 Sub2API 后再打开作品页面');$('works').innerHTML='<div class="empty-state"><strong>未登录</strong></div>'}else{Promise.all([loadStatus(),loadWorks()]).catch(error=>showMessage(error.message))}
</script>
</body>
</html>
