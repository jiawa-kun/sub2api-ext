<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每日签到 · Sub2API 扩展</title>
  <link rel="icon" type="image/svg+xml" href="./assets/checkin-icon-app.svg" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="./assets/checkin-icon-app-light.svg" media="(prefers-color-scheme: light)" />
  <link id="favicon" rel="icon" type="image/svg+xml" href="./assets/checkin-icon-app.svg" />
  <style>
:root {
  --bg0:#070b16; --bg1:#121a2f; --card:rgba(18,26,43,.92); --text:#eef3ff; --muted:#93a0b8;
  --primary:#5b8cff; --primary2:#7c5cff; --ok:#22c55e; --danger:#f43f5e; --warn:#f59e0b;
  --border:rgba(255,255,255,.09); --soft:rgba(255,255,255,.04); --soft2:rgba(255,255,255,.07);
  --shadow:0 16px 40px rgba(0,0,0,.28); --glow:rgba(91,140,255,.28);
  --radius:18px; --radius-sm:12px;
}
html.light {
  --bg0:#eef2ff; --bg1:#f8fafc; --card:rgba(255,255,255,.96); --text:#0f172a; --muted:#64748b;
  --border:rgba(15,23,42,.08); --soft:rgba(15,23,42,.03); --soft2:rgba(15,23,42,.06);
  --shadow:0 12px 30px rgba(15,23,42,.08); --glow:rgba(59,130,246,.16);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 420px at 10% -12%, var(--glow), transparent 58%),
    radial-gradient(720px 340px at 100% 0%, rgba(124,92,255,.14), transparent 52%),
    linear-gradient(180deg,var(--bg0),var(--bg1));
  display:flex; justify-content:center; padding:16px 14px 36px;
}
.wrap{width:min(480px,100%); display:flex; flex-direction:column; gap:12px}
a{color:var(--primary); text-decoration:none}
.top{
  display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 14px 12px;
}
.topnav{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px}
.topnav a{
  text-decoration:none; color:var(--text); font-size:.78rem; font-weight:650;
  border:1px solid var(--border); border-radius:999px; padding:6px 10px 6px 8px; background:var(--soft);
  display:inline-flex; align-items:center; gap:6px;
}
.topnav a svg{width:14px; height:14px; flex:none; opacity:.9}
.topnav a.active{border-color:rgba(91,140,255,.45); background:rgba(91,140,255,.12); color:#9db7ff}
html.light .topnav a.active{color:#4f46e5}
.brand-title{display:flex; align-items:center; gap:10px}
.brand-title .logo{width:34px; height:34px; border-radius:10px; flex:none; box-shadow:0 6px 16px rgba(91,140,255,.18)}
.brand-title .logo.dark{display:block}
.brand-title .logo.light{display:none}
html.light .brand-title .logo.dark{display:none}
html.light .brand-title .logo.light{display:block}
.brand-title h1{margin:0}
h1{margin:0; font-size:1.22rem}
.lead,.sub{margin:6px 0 0; color:var(--muted); font-size:.82rem; line-height:1.45}
.top-meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end}
.task-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:.78rem;font-weight:650;color:var(--primary)}
.task-link.hidden{display:none}
.theme-btn{
  border:1px solid var(--border); background:var(--soft2); color:var(--text);
  border-radius:999px; padding:5px 10px; font-size:.72rem; font-weight:650; cursor:pointer;
}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px; position:relative;
}
.card.is-loading{opacity:.72; pointer-events:none}
.head{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:12px}
.badge{
  flex:none; font-size:.72rem; font-weight:700; border-radius:999px; padding:4px 9px;
  border:1px solid var(--border); color:var(--muted); background:var(--soft2);
}
.badge.off{color:var(--danger); border-color:rgba(244,63,94,.28); background:rgba(244,63,94,.1)}
.hero{
  border-radius:14px; padding:14px; margin-bottom:12px;
  background:linear-gradient(145deg,rgba(91,124,250,.13),rgba(124,108,240,.06));
  border:1px solid rgba(91,124,250,.16);
}
.hero.success{
  background:linear-gradient(145deg,rgba(16,185,129,.14),rgba(16,185,129,.05));
  border-color:rgba(16,185,129,.22);
}
.hero .label{font-size:.75rem; color:var(--muted); margin-bottom:2px}
.hero .amount{font-size:1.7rem; font-weight:800; letter-spacing:.2px; line-height:1.2}
.hero .meta{margin-top:4px; font-size:.76rem; color:var(--muted); line-height:1.35}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat{
  border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--soft);
}
.stat .k{font-size:.72rem; color:var(--muted)}
.stat .v{margin-top:4px; font-size:1.05rem; font-weight:750}
.meta-line{margin:10px 0 12px; color:var(--muted); font-size:.78rem}
.budget{
  border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:12px; background:var(--soft);
}
.budget .row{display:flex; justify-content:space-between; gap:8px; font-size:.8rem; color:var(--muted)}
.bar{height:8px; border-radius:999px; background:rgba(127,127,127,.12); overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--primary),var(--primary2))}
button.btn, #btn{
  width:100%; border:0; border-radius:12px; padding:12px 14px; cursor:pointer;
  font-size:.92rem; font-weight:750; color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 8px 18px rgba(91,140,255,.22);
}
#btn:disabled{opacity:.55; cursor:not-allowed; box-shadow:none}
#btn.ghost, .btn.ghost{
  background:var(--soft2); color:var(--text); border:1px solid var(--border); box-shadow:none;
}
#btn.done, .btn.done{
  background:linear-gradient(135deg,#10b981,#059669);
}
.msg{margin-top:10px; padding:8px 10px; border-radius:10px; display:none; font-size:.84rem}
.msg.show{display:block}
.msg.ok{background:rgba(34,197,94,.12); color:var(--ok)}
.msg.warn{background:rgba(245,158,11,.12); color:var(--warn)}
.msg.err{background:rgba(244,63,94,.12); color:var(--danger)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{
  font-size:.72rem; border:1px solid var(--border); border-radius:999px; padding:3px 8px;
  color:var(--muted); background:var(--soft);
}
details.more{
  margin-top:12px; border:1px solid var(--border); border-radius:12px; background:var(--soft); overflow:hidden;
}
details.more > summary{
  cursor:pointer; list-style:none; padding:10px 12px; font-size:.84rem; font-weight:700;
}
details.more > summary::-webkit-details-marker{display:none}
details.more .body{padding:0 12px 12px}
.sec-title{margin:0; font-size:.9rem}
.cal-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px}
.row-inline{display:flex; gap:6px}
.btn-mini{
  border:1px solid var(--border); background:var(--soft2); color:var(--text);
  border-radius:8px; padding:4px 10px; cursor:pointer; font-weight:700;
}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.cal-dow{text-align:center; font-size:.68rem; color:var(--muted); padding:2px 0}
.cal-day{
  min-height:42px; border-radius:10px; border:1px solid var(--border);
  background:rgba(127,127,127,.04); padding:4px; font-size:.72rem; text-align:center;
}
.cal-day.checked{border-color:rgba(34,197,94,.3); background:rgba(34,197,94,.1)}
.cal-day.today{box-shadow:inset 0 0 0 1px rgba(91,140,255,.45)}
.cal-day .amt{margin-top:2px; color:var(--ok); font-size:.66rem}
.history-panel{margin-top:12px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--soft)}
.history-title{margin-bottom:10px;font-size:.86rem;font-weight:750}
.history{display:flex; flex-direction:column; gap:8px}
.hist-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:.8rem;
  border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:rgba(127,127,127,.03);
}
.hist-copy{min-width:0}
.hist-main{display:block;font-weight:650}
.hist-sub{display:block;margin-top:2px;color:var(--muted);font-size:.7rem;overflow-wrap:anywhere}
.hist-value{flex:none;color:var(--ok);font-weight:700}
.hist-value.miss{color:var(--muted)}
.foot{
  margin-top:14px; display:flex; justify-content:space-between; align-items:center; gap:8px;
  color:var(--muted); font-size:.76rem;
}
#adminLink,#adminTopLink,.topnav a.nav-extra{display:none}
#userLine{max-width:55%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right}
  .lottery{margin-top:16px;padding:18px;border-radius:12px;border:1px solid var(--border);background:var(--soft)}
  .lottery-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .lottery-title{font-weight:700;font-size:14px}
  .lottery-state{display:inline-flex;align-items:center;min-height:26px;padding:4px 8px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted);background:var(--soft2)}
  .lottery-state.ready{color:var(--ok);border-color:rgba(22,163,74,.28);background:rgba(22,163,74,.08)}
  .lottery-state.wait{color:var(--warn);border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.08)}
  .lottery-wheel-area{position:relative;width:min(326px,100%);aspect-ratio:1;margin:8px auto 18px}
  .lottery-pointer{
    position:absolute;left:50%;top:-2px;z-index:4;transform:translateX(-50%);
    width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--warn);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));
  }
  .lottery-wheel{
    position:absolute;inset:10px;border-radius:50%;overflow:hidden;
    border:8px solid rgba(255,255,255,.88); background:var(--soft2);
    box-shadow:0 16px 32px rgba(15,23,42,.14), inset 0 0 0 1px rgba(255,255,255,.38);
    transform:rotate(0deg); transition:transform 3s cubic-bezier(.12,.72,.12,1);
  }
  html:not(.light) .lottery-wheel{border-color:rgba(255,255,255,.12); box-shadow:0 16px 30px rgba(0,0,0,.26), inset 0 0 0 1px rgba(255,255,255,.08)}
  .lottery-wheel::after{
    content:""; position:absolute; inset:24%; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,.48));
    border:1px solid rgba(255,255,255,.58);
  }
  html:not(.light) .lottery-wheel::after{background:radial-gradient(circle,rgba(15,23,42,.9),rgba(15,23,42,.55)); border-color:rgba(255,255,255,.08)}
  .lottery-label{
    position:absolute;left:50%;top:50%;z-index:2;width:82px;margin-left:-41px;margin-top:-14px;
    text-align:center;font-size:11px;font-weight:750;line-height:1.15;color:#0f172a;
    text-shadow:0 1px 0 rgba(255,255,255,.55);white-space:normal;overflow-wrap:anywhere;
    transform-origin:center center;
  }
  .lottery-label.miss{color:#475569}
  .lottery-center{
    position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);
    width:106px;height:106px;border-radius:50%;padding:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.86);box-shadow:0 10px 22px rgba(15,23,42,.16);
  }
  html:not(.light) .lottery-center{background:linear-gradient(145deg,rgba(30,41,59,.98),rgba(15,23,42,.9)); border-color:rgba(255,255,255,.12)}
  #lotteryBox #lotteryBtn{
    width:82px;height:82px;min-height:82px;border:1px solid #2563eb;border-radius:50%;padding:0 10px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:#fff;background:#3b82f6;box-shadow:0 8px 18px rgba(37,99,235,.28);
    font-size:.9rem;font-weight:750;line-height:1.2;letter-spacing:0;
    transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease;
  }
  #lotteryBox #lotteryBtn:not(:disabled):hover{border-color:#1d4ed8;background:#2563eb;box-shadow:0 10px 20px rgba(37,99,235,.34);transform:translateY(-1px)}
  #lotteryBox #lotteryBtn:disabled{opacity:1;cursor:default}
  #lotteryBox #lotteryBtn.done{border-color:var(--border);color:var(--text);background:var(--soft2);box-shadow:inset 0 0 0 1px rgba(127,127,127,.04)}
  .lottery-prizes{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
  .lottery-prize{display:inline-flex;align-items:center;max-width:100%;min-width:0;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:transparent}
  .lottery-prize.is-selected{border-color:rgba(22,163,74,.4);color:var(--ok,#16a34a);background:rgba(22,163,74,.08)}
  .lottery-prize-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit;font-size:12px;font-weight:650}
  .lottery-result{margin-bottom:10px;padding:11px 12px;border-radius:8px;text-align:center;font-weight:650;font-size:14px}
  .lottery-result.win{background:rgba(22,163,74,.12);color:var(--ok,#16a34a)}
  .lottery-result.miss{background:rgba(127,127,127,.12);opacity:.75}
  .lottery.is-drawing .lottery-state{color:var(--warn);opacity:1}
  @media (prefers-reduced-motion:reduce){
    .lottery-wheel{transition:none!important}
  }
  @media (max-width:380px){
    .lottery{padding:12px}
    .lottery-wheel-area{width:min(274px,100%)}
    .lottery-label{width:68px;margin-left:-34px;font-size:10px}
    .lottery-center{width:94px;height:94px;padding:9px}
    #lotteryBox #lotteryBtn{width:74px;height:74px;min-height:74px;font-size:.82rem}
  }
  </style>

</head>

                <button id="lotteryBtn" class="btn lottery-spin-btn" disabled>抽奖</button>

<script>

    const params = new URLSearchParams(location.search);
    const THEME_KEY = 'sub2api_ext_theme';
    const THEME_KEY_LEGACY = 'sub2api_admin_theme';
    function applyFavicon(light){
      const link = document.getElementById('favicon');
      if(link) link.href = light ? './assets/checkin-icon-app-light.svg' : './assets/checkin-icon-app.svg';
    }
    function initTheme(){
      const q=(params.get('theme')||'').toLowerCase();
      let saved='';
      try{ saved=localStorage.getItem(THEME_KEY)||localStorage.getItem(THEME_KEY_LEGACY)||''; }catch{}
      const light = q==='light' || (!q && saved==='light');
      document.documentElement.classList.toggle('light', !!light);
      applyFavicon(!!light);
      const label=document.querySelector('#themeBtn .theme-label');
      if(label) label.textContent = light ? '深色' : '浅色';
    }
    function toggleTheme(){
      const light = !document.documentElement.classList.contains('light');
      document.documentElement.classList.toggle('light', light);
      try{
        localStorage.setItem(THEME_KEY, light?'light':'dark');
        localStorage.setItem(THEME_KEY_LEGACY, light?'light':'dark');
      }catch{}
      const label=document.querySelector('#themeBtn .theme-label');
      if(label) label.textContent = light ? '深色' : '浅色';
      applyFavicon(light);
    }
    function keepQuery(href){
      try{
        const u = new URL(href, location.href);
        if(u.origin !== location.origin) return href;
        for(const k of ['theme']){
          const v = params.get(k);
          if(v && !u.searchParams.get(k)) u.searchParams.set(k, v);
        }
        const curDir = location.pathname.replace(/[^/]*$/, '');
        let rel;
        if(u.pathname.startsWith(curDir)){
          const rest = u.pathname.slice(curDir.length);
          rel = rest ? './' + rest : './';
        } else {
          rel = u.pathname;
        }
        return rel + u.search + u.hash;
      }catch{ return href; }
    }
    function wireInternalNav(){
      document.querySelectorAll('a[href]').forEach(a=>{
        const href = a.getAttribute('href');
        if(!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
        if(/^https?:/i.test(href)) return;
        a.setAttribute('href', keepQuery(href));
      });
    }
    const el = id => document.getElementById(id);
    const msg = el('msg');
    function showMsg(text, type){ msg.textContent=text; msg.className='msg show '+type; }
    function money(n){
      const x=Number(n); if(!Number.isFinite(x)) return '—';
      return '$' + x.toFixed(4).replace(/\.?0+$/, m => m.includes('.') ? m.replace(/0+$/,'').replace(/\.$/,'') : m);
    }
    function readStorage(key){ try{return localStorage.getItem(key)||''}catch{return ''} }
    function cleanToken(raw){
      let t=(raw||'').trim();
      if(/^bearer\s+/i.test(t)) t=t.replace(/^bearer\s+/i,'');
      return t.replace(/^["']|["']$/g,'');
    }
    function storageGetAll(key){
      const out=[];
      try{ const v=localStorage.getItem(key); if(v) out.push(v); }catch{}
      try{
        if(window.parent && window.parent!==window){
          const v=window.parent.localStorage.getItem(key);
          if(v) out.push(v);
        }
      }catch{}
      try{ const v=sessionStorage.getItem(key); if(v) out.push(v); }catch{}
      return out;
    }
    function storageGet(key){
      // Prefer parent (main site) over iframe self, so re-login wins over stale iframe cache.
      try{
        if(window.parent && window.parent!==window){
          const v=window.parent.localStorage.getItem(key);
          if(v) return v;
        }
      }catch{}
      try{ const v=localStorage.getItem(key); if(v) return v; }catch{}
      return '';
    }
    function storageSet(key, val){
      try{ localStorage.setItem(key, val); }catch{}
      try{
        if(window.parent && window.parent!==window){
          window.parent.localStorage.setItem(key, val);
        }
      }catch{}
    }
    function cleanTokenQuery(){
      if(!params.has('token')) return;
      params.delete('token');
      try{
        const q=params.toString();
        history.replaceState(null,'',location.pathname+(q?'?'+q:'')+location.hash);
      }catch{}
    }
    function storageClearLocal(keys){
      try{
        (keys||[]).forEach(k=>{ try{ localStorage.removeItem(k); }catch{} });
      }catch{}
    }
    function b64urlJson(part){
      try{
        const s=part.replace(/-/g,'+').replace(/_/g,'/');
        const pad=s.length%4===0?'':'='.repeat(4-s.length%4);
        return JSON.parse(atob(s+pad));
      }catch{ return null; }
    }
    function jwtExp(token){
      const t=cleanToken(token||'');
      if(!t) return 0;
      const parts=t.split('.');
      if(parts.length<2) return 0;
      const payload=b64urlJson(parts[1]);
      const exp=payload && Number(payload.exp);
      return Number.isFinite(exp)?exp:0;
    }
    function tokenExpiredOrNear(token, skewSec){
      const exp=jwtExp(token);
      if(!exp) return false; // not a JWT / unknown -> do not force refresh
      const now=Math.floor(Date.now()/1000);
      return exp <= now + (skewSec||60);
    }
    function scoreToken(token){
      const t=cleanToken(token||'');
      if(!t) return -1;
      const exp=jwtExp(t);
      const now=Math.floor(Date.now()/1000);
      if(exp > now + 30) return 1e12 + exp;          // valid JWT: prefer later exp
      if(exp > 0) return exp;                         // expired JWT: weak fallback
      return 1e9;                                     // non-JWT opaque token: mid priority
    }
    
    function tasksHref(){
      try{
        const u=new URL('./tasks.html', location.href);
        const th=document.documentElement.classList.contains('light')?'light':'';
        if(th) u.searchParams.set('theme', th==='light'?'light':'dark');
        return u.pathname + u.search + u.hash;
      }catch{ return './tasks.html'; }
    }
    function refreshTaskHint(){
      const a=document.getElementById('taskHint');
      if(!a) return;
      a.href=tasksHref();
      a.classList.remove('hidden');
    }
function pickToken(){
      const keys=['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];
      const cands=[];
      for(const k of keys){
        for(const raw of storageGetAll(k)){
          const t=cleanToken(raw);
          if(t) cands.push(t);
        }
      }
      const q=cleanToken(params.get('token')||'');
      if(q) cands.push(q);
      const uniq=[...new Set(cands)];
      if(!uniq.length) return '';
      let best='', bestScore=-1;
      for(const t of uniq){
        const sc=scoreToken(t);
        if(sc>bestScore){ bestScore=sc; best=t; }
      }
      return best;
    }
    function resyncTokenFromParent(){
      // Only drop iframe cache when parent actually has a fresher token.
      const authKeys=['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];
      const parentCands=[];
      try{
        if(window.parent && window.parent!==window){
          for(const k of authKeys){
            try{
              const v=window.parent.localStorage.getItem(k);
              const t=cleanToken(v||'');
              if(t) parentCands.push(t);
            }catch{}
          }
        }
      }catch{}
      const uniq=[...new Set(parentCands)];
      let best='', bestScore=-1;
      for(const t of uniq){
        const sc=scoreToken(t);
        if(sc>bestScore){ bestScore=sc; best=t; }
      }
      if(best && !tokenExpiredOrNear(best, 90)){
        storageClearLocal(authKeys);
        accessToken=best;
        try{ localStorage.setItem('auth_token', best); }catch{}
        return best;
      }
      // parent unavailable or also expired: re-pick across both (no forced clear)
      const t=pickToken();
      if(t){ accessToken=t; }
      return t;
    }
    let accessToken = pickToken();
    // Persist URL/parent token so in-app navigation no longer loses login.
    if(accessToken){
      try{ localStorage.setItem('auth_token', accessToken); }catch{}
      try{
        if(window.parent && window.parent!==window){
          window.parent.localStorage.setItem('auth_token', accessToken);
        }
      }catch{}
    }
    cleanTokenQuery();

    function isExpiredAuthError(err){
      const m=String(err&&err.message?err.message:err||'');
      return /TOKEN_EXPIRED|token has expired|expired user token|invalid or expired/i.test(m);
    }
    function friendlyAuthError(err){
      if(isExpiredAuthError(err)){
        return '登录已过期，请刷新主站页面或重新登录后再打开签到';
      }
      const m=String(err&&err.message?err.message:err||'');
      if(/missing token|未检测|empty user token/i.test(m)){
        return '未检测到登录态，请从 Sub2API 内打开签到';
      }
      return m;
    }
    function extractAccessToken(data){
      if(!data || typeof data!=='object') return '';
      const d=data.data&&typeof data.data==='object'?data.data:null;
      return cleanToken(
        data.access_token || data.token || data.auth_token ||
        (d && (d.access_token || d.token || d.auth_token)) ||
        ''
      );
    }
    function extractRefreshToken(data){
      if(!data || typeof data!=='object') return '';
      const d=data.data&&typeof data.data==='object'?data.data:null;
      return cleanToken(
        data.refresh_token || data.refreshToken ||
        (d && (d.refresh_token || d.refreshToken)) ||
        ''
      );
    }
    function applyTokens(at, rt){
      if(at){
        accessToken=cleanToken(at);
        storageSet('auth_token', accessToken);
        storageSet('access_token', accessToken);
      }
      if(rt){
        const r=cleanToken(rt);
        storageSet('refresh_token', r);
        storageSet('refreshToken', r);
      }
    }

    async function tryRefresh(){
      // collect refresh candidates from both storages
      const rkeys=['refresh_token','refreshToken','refresh','sub2api_refresh_token'];
      const rcands=[];
      for(const k of rkeys){
        for(const raw of storageGetAll(k)){
          const t=cleanToken(raw);
          if(t) rcands.push(t);
        }
      }
      const uniq=[...new Set(rcands)];
      if(!uniq.length) return false;
      const bodiesFor = (refresh)=>[
        {refresh_token: refresh},
        {refreshToken: refresh},
        {token: refresh},
      ];
      for(const refresh of uniq){
        for(const body of bodiesFor(refresh)){
          try{
            const res=await fetch('/api/v1/auth/refresh',{
              method:'POST',
              credentials:'same-origin',
              headers:{'Content-Type':'application/json','Accept':'application/json'},
              body:JSON.stringify(body)
            });
            const data=await res.json().catch(()=>({}));
            if(!res.ok) continue;
            const at=extractAccessToken(data);
            if(!at) continue;
            const rt=extractRefreshToken(data);
            applyTokens(at, rt);
            return true;
          }catch{}
        }
      }
      return false;
    }

    async function ensureFreshToken(){
      accessToken = pickToken() || accessToken;
      if(!accessToken) return false;
      if(tokenExpiredOrNear(accessToken, 90)){
        // iframe may hold stale token while parent has a fresh login
        const parentish = resyncTokenFromParent();
        if(parentish && !tokenExpiredOrNear(parentish, 90)){
          return true;
        }
        const ok=await tryRefresh();
        if(!ok) return false;
      }
      return !!accessToken;
    }

    async function api(path, opts={}, retried=false){
      if(!retried){
        await ensureFreshToken();
      }
      const headers=Object.assign({'Accept':'application/json'}, opts.headers||{});
      if(accessToken){
        headers['Authorization']='Bearer '+accessToken;
        headers['X-User-Token']=accessToken;
      }
      const res=await fetch(path,{...opts,headers,credentials: opts.credentials||'same-origin'});
      const data=await res.json().catch(()=>({}));
      const rawErr=data.error||data.message||data.detail||('HTTP '+res.status);
      const expired = res.status===401 || /TOKEN_EXPIRED|expired/i.test(String(rawErr));
      if(expired && !retried){
        const parentish = resyncTokenFromParent();
        if(parentish && !tokenExpiredOrNear(parentish, 90)){
          accessToken = parentish;
          return api(path, opts, true);
        }
        const ok=await tryRefresh();
        if(ok) return api(path, opts, true);
      }
      if(!res.ok) throw new Error(rawErr);
      return data;
    }

    function renderStatus(s){
      const enabled=!!s.enabled;
      el('stateBadge').textContent = enabled ? '开放中' : '已关闭';
      el('stateBadge').className = 'badge ' + (enabled?'on':'off');
      const random = s.reward_mode==='random' || s.random_reward;
      if(s.checked_in_today && s.today_reward!=null){
        el('rewardLabel').textContent='今日已领 ✓';
        el('reward').textContent=money(s.today_reward);
        el('rewardMeta').textContent='签到成功 · '+ (s.today||''); refreshTaskHint();
      } else if(random){
        el('rewardLabel').textContent='今日奖励（随机）';
        el('reward').textContent=money(s.reward_min)+' ~ '+money(s.reward_max);
        el('rewardMeta').textContent='单次硬顶 '+money(s.hard_cap||0)+' · '+(s.timezone||'');
      } else {
        el('rewardLabel').textContent='今日奖励（固定）';
        el('reward').textContent=money(s.reward_amount);
        el('rewardMeta').textContent='单次硬顶 '+money(s.hard_cap||0)+' · '+(s.timezone||'');
      }
      el('balance').textContent = s.balance!=null ? money(s.balance) : '—';
      el('total').textContent = s.total_checkins!=null ? String(s.total_checkins) : '—';
      if(s.streak_enabled){
        el('streak').textContent = (s.checked_in_today?s.current_streak:s.next_streak||s.current_streak||0) + ' 天';
        el('streakBonus').textContent = s.streak_bonus>0 ? ('+'+money(s.streak_bonus)) : money(0);
      } else {
        el('streak').textContent = '关闭';
        el('streakBonus').textContent = '—';
      }
      el('hint').textContent = `日期 ${s.today||'—'} · 时区 ${s.timezone||'—'}`;
      if(s.username||s.email) el('userLine').textContent = s.username || s.email;
      const adminDisplay=s.is_admin?'inline-flex':'none';
      document.querySelectorAll('.topnav a.nav-extra').forEach(a=>{ a.style.display = adminDisplay; });
      el('adminLink').style.display=s.is_admin?'inline':'none';

      if(s.daily_budget>0){
        el('budgetBox').style.display='block';
        const spent=Number(s.daily_spent||0);
        const bud=Number(s.daily_budget);
        const pct=Math.max(0, Math.min(100, (spent/bud)*100));
        el('budgetBar').style.width=pct+'%';
        el('budgetText').textContent = money(spent)+' / '+money(bud);
      } else {
        el('budgetBox').style.display='none';
      }

      const btn=el('btn');
      const hero=el('hero');
      if(hero) hero.classList.toggle('success', !!(s.checked_in_today && s.today_reward!=null));
      if(!enabled){
        btn.disabled=true; btn.textContent='签到已关闭'; btn.className='btn ghost';
      } else if(s.checked_in_today){
        btn.disabled=true; btn.textContent='今日已签到 ✓'; btn.className='btn done';
      } else if(s.daily_budget>0 && s.daily_remaining!=null && Number(s.daily_remaining)<0.0001){
        btn.disabled=true; btn.textContent='今日预算已用尽'; btn.className='btn ghost';
      } else if(!accessToken){
        btn.disabled=true; btn.textContent='请先登录'; btn.className='btn ghost';
      } else {
        btn.disabled=false; btn.textContent='立即签到'; btn.className='btn primary';
      }

      const box=el('recent');
      if(s.recent && s.recent.length){
        box.innerHTML='';
        s.recent.forEach(it=>{
          const d=document.createElement('div');
          d.className='hist-item';
          d.innerHTML=`<span class="hist-copy"><span class="hist-main">${it.date}</span><span class="hist-sub">签到成功</span></span><span class="hist-value">+${money(it.amount)}</span>`;
          box.appendChild(d);
        });
      } else {
        box.innerHTML='<div class="sub" style="margin:0">暂无记录</div>';
      }
    }

    let calYear=0, calMonth=0;
    function renderMilestone(s){
      const elM=el('milestoneHint');
      if(!elM) return;
      elM.innerHTML='';
      if(!s.streak_enabled){ elM.style.display='none'; return; }
      const chips=[];
      if(s.milestone_bonus>0) chips.push(['今日里程碑 +'+money(s.milestone_bonus),'ok']);
      if(s.streak_bonus>0) chips.push(['连签 +'+money(s.streak_bonus),'']);
      if(s.next_milestone_day) chips.push(['下一日 D'+s.next_milestone_day+' +'+money(s.next_milestone_amount),'']);
      const ms=s.streak_milestones||{};
      Object.keys(ms).sort((a,b)=>Number(a)-Number(b)).slice(0,4).forEach(k=>{
        chips.push(['D'+k+' +'+money(ms[k]),'soft']);
      });
      if(!chips.length){ elM.style.display='none'; return; }
      elM.style.display='flex';
      chips.forEach(function(item){
        const sp=document.createElement('span');
        sp.className='chip'+(item[1]?' '+item[1]:'');
        sp.textContent=item[0];
        elM.appendChild(sp);
      });
    }
    async function loadCalendar(y,m){
      if(!accessToken){ el('calendar').innerHTML='<div class="sub" style="grid-column:1/-1;margin:0">登录后显示月历</div>'; return; }
      try{
        const q=new URLSearchParams({year:String(y),month:String(m)});
        const data=await api('./api/calendar?'+q.toString());
        calYear=data.year; calMonth=data.month;
        el('calTitle').textContent=calYear+'-'+String(calMonth).padStart(2,'0')+' 签到月历';
        const map={};
        (data.days||[]).forEach(d=>{ map[d.date]=d; });
        const first=new Date(calYear, calMonth-1, 1);
        const startPad=(first.getDay()+6)%7; // Monday first
        const daysInMonth=new Date(calYear, calMonth, 0).getDate();
        const todayStr=new Date().toISOString().slice(0,10);
        const box=el('calendar'); box.innerHTML='';
        ['一','二','三','四','五','六','日'].forEach(w=>{
          const d=document.createElement('div'); d.className='cal-dow'; d.textContent=w; box.appendChild(d);
        });
        for(let i=0;i<startPad;i++){ const e=document.createElement('div'); box.appendChild(e); }
        for(let d=1;d<=daysInMonth;d++){
          const date=calYear+'-'+String(calMonth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
          const cell=document.createElement('div');
          cell.className='cal-day';
          const info=map[date];
          if(info&&info.checked){ cell.classList.add('checked'); cell.innerHTML='<div>'+d+'</div><div class="amt">'+(info.amount!=null?money(info.amount):'')+'</div>'; cell.title=date+' '+money(info.amount); }
          else { cell.textContent=String(d); cell.title=date; }
          if(date===todayStr) cell.classList.add('today');
          box.appendChild(cell);
        }
      }catch(e){
        el('calendar').innerHTML='<div class="sub" style="grid-column:1/-1;margin:0">月历加载失败</div>';
      }
    }
    async function load(){
      const card=document.querySelector('.card');
      if(card) card.classList.add('is-loading');
      try{
        accessToken = pickToken() || accessToken;
        if(accessToken){
          try{ localStorage.setItem('auth_token', accessToken); }catch{}
        }
        if(!accessToken){
          el('hint').textContent='未检测到登录态，请从 Sub2API 内打开';
          el('stateBadge').textContent='未登录';
          el('stateBadge').className='badge';
          el('btn').disabled=true; el('btn').textContent='请先登录后签到'; el('btn').className='btn ghost';
          el('rewardMeta').textContent='登录后查看可领额度';
          showMsg('请先登录 Sub2API 后再使用签到','warn');
          return;
        }
        // proactive: prefer parent re-login token over iframe stale cache, then refresh
        if(tokenExpiredOrNear(accessToken, 90)){
          const parentish = resyncTokenFromParent();
          if(parentish && !tokenExpiredOrNear(parentish, 90)){
            accessToken = parentish;
          } else {
            const ok=await tryRefresh();
            if(!ok){
              el('hint').textContent='登录已过期';
              el('stateBadge').textContent='需登录';
              el('stateBadge').className='badge off';
              el('btn').disabled=false; el('btn').textContent='重新加载'; el('btn').className='btn ghost';
              el('rewardMeta').textContent='请刷新主站或重新登录';
              showMsg('登录已过期，请刷新主站页面或重新登录后再打开签到','err');
              return;
            }
          }
        }
        const s=await api('./api/status');
        renderStatus(s);
        renderMilestone(s);
        const now=new Date();
        if(!calYear){ calYear=now.getFullYear(); calMonth=now.getMonth()+1; }
        await loadCalendar(calYear, calMonth);
        await loadLottery();
      }catch(e){
        const friendly=friendlyAuthError(e);
        const expired=isExpiredAuthError(e);
        el('hint').textContent=expired?'登录已过期，请刷新主站':'加载失败，可重试';
        el('stateBadge').textContent=expired?'需登录':'异常';
        el('stateBadge').className='badge off';
        el('btn').disabled=false; el('btn').textContent='重新加载'; el('btn').className='btn ghost';
        el('rewardMeta').textContent=expired?'请刷新主站或重新登录':'可点击下方重新加载';
        showMsg(friendly,'err');
      }finally{
        if(card) card.classList.remove('is-loading');
      }
    }
    // ---- lottery ----
    let lotteryBusy=false;
    let lotteryPrizesCache=[];
    let lotteryRotation=0;
    const LOTTERY_START_DEG=-90;
    const LOTTERY_POINTER_DEG=0;
    const LOTTERY_SPIN_MS=3000;
    const reduceLotteryMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const lotteryColors=['#bfdbfe','#bbf7d0','#fde68a','#fecdd3','#ddd6fe','#bae6fd','#fed7aa','#ccfbf1'];
    function esc(s){
      const d=document.createElement('div');
      d.textContent=s==null?'':String(s);
      return d.innerHTML;
    }
    function wheelPrizeLabel(p){
      return String(p&&p.label!=null?p.label:'');
    }
    function renderLotteryWheel(prizes){
      const wheel=el('lotteryWheel');
      if(!wheel) return;
      const list=Array.isArray(prizes)?prizes.filter(p=>p&&p.label):[];
      if(!list.length){
        wheel.style.background='var(--soft2)';
        wheel.innerHTML='';
        return;
      }
      const step=360/list.length;
      wheel.style.background='conic-gradient(from '+LOTTERY_START_DEG+'deg, '+list.map((p,i)=>{
        const color=lotteryColors[i%lotteryColors.length];
        return color+' '+(i*step)+'deg '+((i+1)*step)+'deg';
      }).join(',')+')';
      const radius=Math.max(72, Math.min(106, (wheel.clientWidth||260)*0.36));
      wheel.innerHTML=list.map((p,i)=>{
        const mid=segmentCenterDeg(i);
        const win=Number(p.amount)>0;
        return '<span class="lottery-label '+(win?'win':'miss')+'" data-angle="'+mid+'" data-radius="'+radius+'" title="'+esc(p.label)+'">'+esc(wheelPrizeLabel(p))+'</span>';
      }).join('');
      applyLotteryLabelTransforms();
    }
    function segmentCenterDeg(idx){
      const n=lotteryPrizesCache.length;
      if(!n) return LOTTERY_POINTER_DEG;
      return LOTTERY_START_DEG + (idx+.5)*(360/n);
    }
    function prizeIndexByLabel(label, amount){
      const target=String(label||'');
      if(!target || !lotteryPrizesCache.length) return -1;
      const targetAmount=Number(amount||0);
      const exact=lotteryPrizesCache.findIndex(p=>String(p.label||'')===target&&Number(p.amount||0)===targetAmount);
      return exact>=0?exact:lotteryPrizesCache.findIndex(p=>String(p.label||'')===target);
    }
    function resolvePrizeIndex(index,label,amount){
      const n=lotteryPrizesCache.length;
      const parsed=Number(index);
      if(Number.isInteger(parsed)&&parsed>=0&&parsed<n) return parsed;
      return prizeIndexByLabel(label,amount);
    }
    function wheelRotationForIndex(idx){
      const n=lotteryPrizesCache.length;
      if(!n || idx<0) return lotteryRotation;
      const center=segmentCenterDeg(idx);
      let next=Math.ceil(lotteryRotation/360)*360 + 1080 + LOTTERY_POINTER_DEG - center;
      while(next<lotteryRotation+720) next+=360;
      return next;
    }
    function applyLotteryLabelTransforms(){
      const wheel=el('lotteryWheel');
      if(!wheel) return;
      wheel.querySelectorAll('.lottery-label').forEach(node=>{
        const angle=Number(node.getAttribute('data-angle'))||0;
        const radius=Number(node.getAttribute('data-radius'))||80;
        const correction=-(angle+lotteryRotation);
        node.style.transform='rotate('+angle+'deg) translateY(-'+radius+'px) rotate('+correction+'deg)';
      });
    }
    function setWheelRotation(deg, animate){
      const wheel=el('lotteryWheel');
      if(!wheel) return;
      wheel.style.transition=animate&&!reduceLotteryMotion?'transform '+LOTTERY_SPIN_MS+'ms cubic-bezier(.12,.72,.12,1)':'none';
      lotteryRotation=deg;
      wheel.style.transform='rotate('+deg+'deg)';
      applyLotteryLabelTransforms();
      if(!animate){
        requestAnimationFrame(()=>{ wheel.style.transition=reduceLotteryMotion?'none':'transform '+LOTTERY_SPIN_MS+'ms cubic-bezier(.12,.72,.12,1)'; });
      }
    }
    function snapWheelToPrize(index,label,amount){
      const idx=resolvePrizeIndex(index,label,amount);
      if(idx<0) return;
      setWheelRotation(LOTTERY_POINTER_DEG-segmentCenterDeg(idx), false);
      selectLotteryPrize(idx);
    }
    function warmSpin(){
      const wheel=el('lotteryWheel');
      if(!wheel) return;
      if(reduceLotteryMotion) return;
      wheel.style.transition='transform .55s linear';
      lotteryRotation+=360;
      wheel.style.transform='rotate('+lotteryRotation+'deg)';
      applyLotteryLabelTransforms();
    }
    function spinWheelToPrize(index,label,amount){
      const idx=resolvePrizeIndex(index,label,amount);
      if(idx<0||reduceLotteryMotion){ snapWheelToPrize(idx,label,amount); return Promise.resolve(); }
      const wheel=el('lotteryWheel');
      if(!wheel) return Promise.resolve();
      setWheelRotation(wheelRotationForIndex(idx), true);
      return new Promise(resolve=>{
        let done=false;
        const finish=()=>{
          if(done) return;
          done=true;
          wheel.removeEventListener('transitionend', finish);
          applyLotteryLabelTransforms();
          selectLotteryPrize(idx);
          resolve();
        };
        wheel.addEventListener('transitionend', finish);
        setTimeout(finish, LOTTERY_SPIN_MS+250);
      });
    }
    function selectLotteryPrize(index){
      document.querySelectorAll('#lotteryPrizes .lottery-prize').forEach((node,i)=>node.classList.toggle('is-selected',i===index));
    }
    function setLotteryState(text,kind){
      const state=el('lotteryState');
      if(!state) return;
      state.textContent=text;
      state.className='lottery-state'+(kind?' '+kind:'');
    }
    function renderLotteryRecent(items){
      const box=el('lotteryRecent');
      if(!box) return;
      const list=Array.isArray(items)?items:[];
      if(!list.length){ box.innerHTML='<div class="sub" style="margin:0">暂无记录</div>'; return; }
      box.innerHTML=list.slice(0,7).map(it=>{
        const amount=Number(it.amount||0);
        const value=amount>0?('+ '+money(amount)):'未中奖';
        return '<div class="hist-item"><span class="hist-copy"><span class="hist-main">'+esc(it.draw_date||'—')+'</span><span class="hist-sub">'+esc(it.prize_label||'谢谢参与')+'</span></span><span class="hist-value '+(amount>0?'':'miss')+'">'+value+'</span></div>';
      }).join('');
    }
    function renderLottery(s){
      renderLotteryRecent(s&&s.recent);
      const box=el('lotteryBox');
      if(!box) return;
      if(!s || !s.enabled){ box.style.display='none'; return; }
      box.style.display='block';
      const prizes=s.prizes||[];
      lotteryPrizesCache=prizes;
      renderLotteryWheel(prizes);
      const wrap=el('lotteryPrizes');
      if(wrap){
        wrap.innerHTML=prizes.map(p=>{
          const label=String(p.label==null?'':p.label);
          return '<div class="lottery-prize" title="'+esc(label)+'"><span class="lottery-prize-name">'+esc(label)+'</span></div>';
        }).join('');
      }
      const btn=el('lotteryBtn');
      const res=el('lotteryResult');
      if(res){ res.style.display='none'; res.textContent=''; }
      selectLotteryPrize(-1);
      if(s.drawn_today){
        setLotteryState('今日已完成','');
        if(res && s.today_prize){
          const won=Number(s.today_amount)>0;
          res.style.display='block';
          res.className='lottery-result '+(won?'win':'miss');
          res.textContent=won?('今日抽中 '+s.today_prize+' · +'+money(s.today_amount)):('今日：'+s.today_prize);
          snapWheelToPrize(s.today_prize_index,s.today_prize,s.today_amount);
        }
        if(btn){ btn.disabled=true; btn.textContent='今日已抽'; btn.className='btn lottery-spin-btn done'; }
        return;
      }
      if(btn){
        if(s.can_draw){ setLotteryState('可抽取','ready'); btn.disabled=false; btn.textContent='抽一次'; btn.className='btn lottery-spin-btn primary'; }
        else { setLotteryState(s.reason||'暂不可抽','wait'); btn.disabled=true; btn.textContent=String(s.reason||'').includes('签到')?'先签到':'暂不可抽'; btn.className='btn lottery-spin-btn done'; }
      }
    }
    async function loadLottery(){
      try{
        const s=await api('./api/lottery/status');
        renderLottery(s);
      }catch{
        renderLotteryRecent([]);
        const box=el('lotteryBox');
        if(box) box.style.display='none';
      }
    }
    async function doDraw(){
      if(lotteryBusy) return;
      lotteryBusy=true;
      const box=el('lotteryBox');
      const btn=el('lotteryBtn');
      if(btn){ btn.disabled=true; btn.textContent='抽取中'; }
      setLotteryState('正在抽取','wait');
      if(box) box.classList.add('is-drawing');
      try{
        warmSpin();
        const r=await api('./api/lottery/draw',{method:'POST'});
        const res=el('lotteryResult');
        if(r.status==='win' || r.status==='miss'){
          await spinWheelToPrize(r.prize_index,r.prize_label,r.amount);
        }
        if(res){
          res.style.display='block';
          if(r.status==='win'){
            res.className='lottery-result win';
            res.textContent='恭喜抽中 '+(r.prize_label||'')+' · +'+money(r.amount);
            refreshTaskHint();
          } else if(r.status==='miss'){
            res.className='lottery-result miss';
            res.textContent=(r.prize_label||'谢谢参与');
          } else {
            res.style.display='none';
            showMsg(r.message||'暂不可抽奖','warn');
          }
        }
        await loadLottery();
        if(r.status==='win'){ await load(); }
      }catch(e){
        showMsg(friendlyAuthError(e),'err');
      }finally{
        if(box) box.classList.remove('is-drawing');
        lotteryBusy=false;
      }
    }

    el('calPrev').onclick=()=>{ let y=calYear,m=calMonth-1; if(m<1){m=12;y--;} loadCalendar(y,m); };
    el('calNext').onclick=()=>{ let y=calYear,m=calMonth+1; if(m>12){m=1;y++;} loadCalendar(y,m); };

    el('btn').onclick = async ()=>{
      if(el('btn').textContent==='重新加载'){ await load(); return; }
      el('btn').disabled=true;
      try{
        const r=await api('./api/checkin',{method:'POST'});
        if(r.status==='success'){
          showMsg('签到成功，到账 '+money(r.amount),'ok'); refreshTaskHint();
        } else if(r.status==='already_checked_in'){
          showMsg('今日已签到','warn'); refreshTaskHint();
        } else if(r.status==='budget_exhausted'){
          showMsg(r.message||'今日预算已用尽','warn');
        } else if(r.status==='disabled'){
          showMsg('签到已关闭','warn');
        } else {
          showMsg(r.message||r.status||'完成','ok');
        }
        await load();
      }catch(e){
        showMsg(friendlyAuthError(e),'err');
        el('btn').disabled=false;
      }
    };

    const lotBtn=el('lotteryBtn');
    if(lotBtn) lotBtn.onclick=()=>doDraw();
    initTheme();
    wireInternalNav();
    const themeBtn = el('themeBtn');
    if(themeBtn) themeBtn.onclick = toggleTheme;
    load();
  
</script>
</body>
</html>
