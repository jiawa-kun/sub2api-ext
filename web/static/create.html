<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AI 创作 · Sub2API</title>
  <link id="favicon" rel="icon" href="./assets/ext-center-icon.svg" />
  <link rel="stylesheet" href="./assets/app.css" />
  <style>
    :root{--bg:var(--app-bg);--surface:var(--app-surface);--raised:var(--app-surface-raised);--soft:var(--app-surface-soft);--text:var(--app-text);--muted:var(--app-muted);--border:var(--app-border);--strong:var(--app-border-strong);--primary:var(--app-primary);--success:var(--app-success);--warning:var(--app-warning);--danger:var(--app-danger);--radius:var(--app-radius);--shadow:var(--app-shadow)}
    .creative-wrap{display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.topnav{display:flex;flex-wrap:wrap}.topnav .nav-extra{display:none}.topnav a svg{width:14px;height:14px;flex:none}.brand-title,.top-meta{display:flex;align-items:center}.brand-title .logo.light{display:none}html.light .brand-title .logo.dark{display:none}html.light .brand-title .logo.light{display:block}.top-meta{gap:8px}.balance-badge{min-height:36px;display:flex;align-items:center;padding:0 11px;border:1px solid var(--border);border-radius:var(--app-radius-sm);background:var(--soft);font-size:.76rem;font-weight:700;white-space:nowrap}.create-main{width:min(880px,100%);margin:0 auto}.studio-panel{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
    .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;border-bottom:1px solid var(--border);background:var(--soft)}.mode-tabs .tab{min-height:40px;border:1px solid transparent;border-radius:var(--app-radius-sm);background:transparent;color:var(--muted);box-shadow:none}.mode-tabs .tab.active{border-color:var(--border);background:var(--surface);color:var(--text)}
    .credential-band{padding:15px 18px;border-bottom:1px solid var(--border);background:var(--raised)}.credential-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.credential-title span,.credential-title strong{display:block}.credential-title span{color:var(--muted);font-size:.68rem;font-weight:700}.credential-title strong{margin-top:2px;font-size:.84rem}.credential-state{display:inline-flex;align-items:center;gap:5px;color:var(--warning);font-size:.7rem;font-weight:700;white-space:nowrap}.credential-state::before{width:7px;height:7px;border-radius:50%;background:currentColor;content:""}.credential-state.ok{color:var(--success)}.credential-list{display:grid;gap:10px}.credential-item{padding-top:10px;border-top:1px solid var(--border)}.credential-item:first-child{padding-top:0;border-top:0}.credential-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:.72rem}.credential-meta strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.credential-meta span{color:var(--muted);white-space:nowrap}.credential-controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px}.credential-controls input{min-width:0;width:100%;box-sizing:border-box}.credential-controls button{white-space:nowrap}.credential-message{display:none;margin-top:8px;font-size:.72rem}.credential-message.show{display:block}.credential-message.ok{color:var(--success)}.credential-message.err{color:var(--danger)}
    .tool-body{padding:20px}.field{margin:0 0 16px}.field label,.field-label{display:block;margin:0 0 7px;color:var(--text);font-size:.78rem;font-weight:700}.field textarea,.field select,.field input{width:100%;box-sizing:border-box}.prompt-wrap{position:relative}.prompt-wrap textarea{min-height:132px;padding-bottom:34px;resize:vertical;line-height:1.55}.prompt-count{position:absolute;right:10px;bottom:9px;color:var(--muted);font-size:.68rem}.model-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.model-health{min-width:76px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--app-radius-sm);background:var(--soft);color:var(--muted);font-size:.7rem;font-weight:700}.model-health.ok{color:var(--success)}.model-hint{min-height:18px;margin-top:6px;color:var(--muted);font-size:.7rem}.model-hint.warn{color:var(--warning)}.control-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.upload-box{position:relative;min-height:88px;display:flex;align-items:center;gap:12px;padding:11px;border:1px dashed var(--strong);border-radius:var(--app-radius-sm);background:var(--soft)}.upload-box.has-image{border-style:solid}.upload-box input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.upload-trigger{min-height:36px;display:inline-flex;align-items:center;padding:7px 11px;border:1px solid var(--border);border-radius:var(--app-radius-sm);background:var(--surface);color:var(--text);font-size:.74rem;font-weight:700;cursor:pointer}.upload-copy{color:var(--muted);font-size:.7rem;line-height:1.45}.upload-preview{display:none;width:68px;height:68px;object-fit:cover;border:1px solid var(--border);border-radius:var(--app-radius-sm);background:var(--surface)}.upload-box.has-image .upload-preview{display:block}.upload-box.has-image .upload-trigger{display:none}.upload-remove{display:none;position:absolute;right:8px;top:8px;width:30px;height:30px;min-height:30px;padding:0;border:1px solid var(--border)!important;border-radius:50%!important;background:var(--surface)!important;color:var(--text)!important;box-shadow:none!important}.upload-box.has-image .upload-remove{display:grid;place-items:center}.price-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:13px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.price-panel span{color:var(--muted);font-size:.76rem}.price-panel strong{font-size:1.1rem;font-variant-numeric:tabular-nums}.submit-btn{width:100%;min-height:44px;margin-top:15px}.message{display:none;margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--app-radius-sm);font-size:.76rem;line-height:1.45}.message.show{display:block}.message.ok{color:var(--success);border-color:color-mix(in srgb,var(--success) 35%,transparent);background:color-mix(in srgb,var(--success) 8%,transparent)}.message.err{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}.hidden{display:none!important}
    @media(max-width:760px){body.app-creative{padding:12px 10px 32px}.top{flex-direction:column}.top-meta{width:100%;justify-content:space-between}.tool-body{padding:16px}.control-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:520px){.credential-band{padding:13px 14px}.credential-controls{grid-template-columns:repeat(2,minmax(0,1fr))}.credential-controls input{grid-column:1/-1}.credential-controls button{width:100%}.tool-body{padding:14px}.control-grid{grid-template-columns:minmax(0,1fr)}.model-line{grid-template-columns:minmax(0,1fr)}.model-health{min-height:34px}}
  </style>
</head>

  <main class="create-main">

      <div class="credential-band hidden" id="credentialBand">
        <div class="credential-head"><div class="credential-title"><span>调用凭据</span><strong>用户 API Key</strong></div><span class="credential-state" id="credentialState">未配置</span></div>

      </div>
      <div class="tool-body">
        <div class="field"><label for="creativePrompt">提示词</label><div class="prompt-wrap"><textarea id="creativePrompt" maxlength="4000" placeholder="描述画面内容、风格和构图"></textarea><span class="prompt-count" id="promptCount">0 / 4000</span></div></div>
        <div class="field"><label for="modelSelect">模型</label><div class="model-line"><select id="modelSelect"></select><div class="model-health" id="modelHealth">—</div></div><div class="model-hint" id="modelHint"></div></div>
        <div class="control-grid">
          <div class="field"><label for="ratioSelect">比例</label><select id="ratioSelect"></select></div>
          <div class="field"><label for="resolutionSelect">分辨率</label><select id="resolutionSelect"></select></div>

          <div class="field hidden" id="durationField"><label for="durationInput">时长（秒）</label><input id="durationInput" type="number" min="1" max="15" value="8" /></div>
        </div>
        <div class="field"><span class="field-label">参考图</span><div class="upload-box" id="uploadBox"><input id="referenceInput" type="file" accept="image/png,image/jpeg,image/webp" /><img class="upload-preview" id="referencePreview" alt="参考图预览" /><label class="upload-trigger" for="referenceInput">选择图片</label><div class="upload-copy" id="uploadCopy">PNG、JPEG 或 WebP，最大 5MB</div><button type="button" class="upload-remove" id="removeReference" title="移除参考图" aria-label="移除参考图">×</button></div></div>

<script>
const AUTH_KEYS=['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];
const state={token:'',mode:'image',models:[],credentials:[],reference:'',uploadLimitMB:5};
const $=id=>document.getElementById(id);
function cleanToken(v){v=(v||'').trim().replace(/^bearer\s+/i,'');return v.replace(/^["']|["']$/g,'')}
function findToken(){const q=cleanToken(new URLSearchParams(location.search).get('token'));if(q)return q;for(const k of AUTH_KEYS){try{const v=cleanToken(localStorage.getItem(k));if(v)return v}catch{}try{if(parent!==window){const v=cleanToken(parent.localStorage.getItem(k));if(v)return v}}catch{}}return ''}
function headers(json=true){const h={};if(state.token)h.Authorization='Bearer '+state.token;if(json)h['Content-Type']='application/json';return h}
async function api(path,opt={}){const response=await fetch(path,{...opt,headers:{...headers(opt.json!==false),...(opt.headers||{})}});const contentType=response.headers.get('content-type')||'';const data=contentType.includes('json')?await response.json():await response.text();if(!response.ok)throw new Error((data&&data.error)||data||('HTTP '+response.status));return data}
function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '$'+Number(v||0).toFixed(4)}
function currentModel(){return state.models.find(model=>String(model.id)===String($('modelSelect').value))}
function modelsForMode(){return state.models.filter(model=>model.capability===(state.mode==='image'?'image_generation':'video_generation')).sort((a,b)=>Number(!!a.constraints?.requires_image)-Number(!!b.constraints?.requires_image)||String(a.display_name||a.model_id).localeCompare(String(b.display_name||b.model_id),'zh-CN'))}
function showMessage(text,type='err'){const node=$('message');node.textContent=text;node.className='message show '+type}
function clearMessage(){const node=$('message');node.textContent='';node.className='message'}
function showCredentialMessage(text,type='err'){const node=$('credentialMessage');node.textContent=text;node.className='credential-message show '+type}
function clearCredentialMessage(){const node=$('credentialMessage');node.textContent='';node.className='credential-message'}
function renderCredentials(){const band=$('credentialBand'),list=$('credentialList'),status=$('credentialState');if(!state.credentials.length){band.classList.add('hidden');list.innerHTML='';return}band.classList.remove('hidden');const configured=state.credentials.filter(item=>item.configured).length,ready=state.credentials.every(item=>item.encryption_ready);status.textContent=!ready?'服务端未启用':configured===state.credentials.length?'已配置':'未配置';status.classList.toggle('ok',ready&&configured===state.credentials.length);list.innerHTML=state.credentials.map(item=>`<div class="credential-item" data-credential-provider="${Number(item.provider_id)}"><div class="credential-meta"><strong>${escapeHTML(item.provider_name||'Sub2API 账号池')}</strong><span>${item.configured?escapeHTML(item.key_hint||'已保存'):'保存后验证'}</span></div><div class="credential-controls"><input type="password" autocomplete="new-password" maxlength="4096" placeholder="${item.configured?'输入新 Key 可替换':'输入 Sub2API API Key'}" ${item.encryption_ready?'':'disabled'} /><button type="button" data-credential-save ${item.encryption_ready?'':'disabled'}>保存并验证</button>${item.configured?'<button type="button" class="secondary" data-credential-delete>删除</button>':''}</div></div>`).join('');list.querySelectorAll('[data-credential-save]').forEach(button=>button.onclick=()=>saveCredential(Number(button.closest('[data-credential-provider]').dataset.credentialProvider)).catch(error=>showCredentialMessage(error.message)));list.querySelectorAll('[data-credential-delete]').forEach(button=>button.onclick=()=>deleteCredential(Number(button.closest('[data-credential-provider]').dataset.credentialProvider)).catch(error=>showCredentialMessage(error.message)))}
async function saveCredential(providerID){const row=document.querySelector(`[data-credential-provider="${providerID}"]`),input=row?.querySelector('input'),button=row?.querySelector('[data-credential-save]'),apiKey=(input?.value||'').trim();if(apiKey.length<8)throw new Error('请输入有效的 API Key');button.disabled=true;clearCredentialMessage();try{await api('./api/creative/credentials',{method:'PUT',body:JSON.stringify({provider_id:providerID,api_key:apiKey})});input.value='';await loadOptions(providerID);showCredentialMessage('API Key 已保存并通过验证','ok')}finally{button.disabled=false}}
async function deleteCredential(providerID){if(!confirm('确定删除这个 API Key 吗？'))return;await api('./api/creative/credentials?provider_id='+encodeURIComponent(providerID),{method:'DELETE'});await loadOptions();showCredentialMessage('API Key 已删除','ok')}
function replaceOptions(select,values,fallback){const previous=select.value;const list=Array.isArray(values)&&values.length?values:fallback;select.innerHTML=list.map(value=>`<option value="${escapeHTML(value)}">${escapeHTML(value)}</option>`).join('');if(list.includes(previous))select.value=previous}
function priceForModel(model){if(!model)return 0;const pricing=model.pricing||{},resolution=$('resolutionSelect').value;const unit=Number((pricing.resolutions&&pricing.resolutions[resolution])||pricing.fixed||0);const quantity=state.mode==='image'?Number($('countSelect').value||1):Number($('durationInput').value||1);let total=unit*quantity;if(state.mode==='image'&&state.reference)total+=Number(pricing.input_image||0);return Math.round(total*10000)/10000}
function syncModelControls(){const model=currentModel(),constraints=model?.constraints||{},hint=$('modelHint');hint.textContent='';hint.classList.remove('warn');if(!model){const missing=state.credentials.some(item=>!item.configured);$('modelHealth').textContent='不可用';$('modelHealth').classList.remove('ok');hint.textContent=missing?'配置 API Key 后显示账号池模型':'当前模式暂无可用模型';hint.classList.toggle('warn',missing);$('submitBtn').disabled=true;$('priceValue').textContent='$0.0000';return}const accounts=Number(model.available_accounts||0);$('modelHealth').textContent=accounts>0?accounts+' 个账号':'可用';$('modelHealth').classList.add('ok');replaceOptions($('ratioSelect'),constraints.aspect_ratios,state.mode==='image'?['1:1','16:9','9:16','4:3','3:4']:['16:9','9:16','1:1']);replaceOptions($('resolutionSelect'),constraints.resolutions,state.mode==='image'?['1k','2k']:['480p','720p']);if(state.mode==='image'){const count=Math.max(1,Math.min(10,Number(constraints.max_images||4))),current=Math.max(1,Number($('countSelect').value||1));$('countSelect').innerHTML=Array.from({length:count},(_,index)=>`<option value="${index+1}">${index+1} 张</option>`).join('');$('countSelect').value=String(Math.min(current,count));$('uploadCopy').textContent=constraints.supports_edit?'上传后自动切换为图片编辑':'当前模型不支持图片编辑'}else{const min=Math.max(1,Number(constraints.duration_min||1)),max=Math.max(min,Number(constraints.duration_max||15));$('durationInput').min=String(min);$('durationInput').max=String(max);$('durationInput').value=String(Math.max(min,Math.min(max,Number($('durationInput').value||8))));$('uploadCopy').textContent='PNG、JPEG 或 WebP，最大 '+Math.min(5,Number(constraints.max_upload_mb||5))+'MB'}state.uploadLimitMB=Math.max(1,Math.min(5,Number(constraints.max_upload_mb||5)));updateEstimate()}
function fillModels(preferredProviderID=0){const available=modelsForMode(),previous=$('modelSelect').value;$('modelSelect').innerHTML=available.map(model=>`<option value="${model.id}">${escapeHTML(model.display_name||model.model_id)}</option>`).join('')||'<option value="">暂无可用模型</option>';const preferred=available.find(model=>Number(model.provider_id)===Number(preferredProviderID));if(preferred)$('modelSelect').value=String(preferred.id);else if(available.some(model=>String(model.id)===previous))$('modelSelect').value=previous;syncModelControls()}
function updateEstimate(){const model=currentModel(),constraints=model?.constraints||{},supportsEdit=!!constraints.supports_edit,requiresImage=!!constraints.requires_image&&!state.reference,invalidEdit=state.mode==='image'&&state.reference&&!supportsEdit;$('priceValue').textContent=money(priceForModel(model));$('submitBtn').textContent=state.mode==='video'?'生成视频':state.reference?'编辑图片':'生成图片';$('submitBtn').disabled=!model||invalidEdit||requiresImage;if(invalidEdit)showMessage('当前模型不支持图片编辑，请移除参考图或更换模型');else if(requiresImage){$('modelHint').textContent='该模型仅支持图片编辑，请上传参考图';$('modelHint').classList.add('warn')}else if($('message').textContent.startsWith('当前模型不支持图片编辑'))clearMessage()}
function setMode(mode){state.mode=mode==='video'?'video':'image';document.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===state.mode));$('countField').classList.toggle('hidden',state.mode==='video');$('durationField').classList.toggle('hidden',state.mode==='image');clearReference();clearMessage();fillModels()}
function clearReference(){$('referenceInput').value='';$('referencePreview').removeAttribute('src');$('uploadBox').classList.remove('has-image');state.reference='';updateEstimate()}
function readReference(file){if(!file){clearReference();return}if(!/^image\/(png|jpeg|webp)$/i.test(file.type)){showMessage('请选择 PNG、JPEG 或 WebP 图片');clearReference();return}if(file.size>state.uploadLimitMB*1024*1024){showMessage('参考图片不能超过 '+state.uploadLimitMB+'MB');clearReference();return}const reader=new FileReader();reader.onload=()=>{state.reference=String(reader.result);$('referencePreview').src=state.reference;$('uploadBox').classList.add('has-image');clearMessage();updateEstimate()};reader.readAsDataURL(file)}
function requestKey(){return 'web_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)}
async function submitCreation(){const model=currentModel(),prompt=$('creativePrompt').value.trim();if(!model)throw new Error('暂无可用模型');if(!prompt&&!(state.mode==='video'&&state.reference))throw new Error('请输入提示词');const button=$('submitBtn');button.disabled=true;clearMessage();try{if(state.mode==='image')await api('./api/creative/images',{method:'POST',body:JSON.stringify({model_id:Number(model.id),prompt,n:Number($('countSelect').value),aspect_ratio:$('ratioSelect').value,resolution:$('resolutionSelect').value,image_data_url:state.reference,request_key:requestKey()})});else await api('./api/creative/videos',{method:'POST',body:JSON.stringify({model_id:Number(model.id),prompt,duration:Number($('durationInput').value),aspect_ratio:$('ratioSelect').value,resolution:$('resolutionSelect').value,image_data_url:state.reference,request_key:requestKey()})});showMessage(state.mode==='image'?'图片已生成，可在“我的作品”中查看':'视频任务已提交，可在“我的作品”中查看','ok');clearReference();await loadOptions()}finally{button.disabled=false;updateEstimate()}}
async function loadOptions(preferredProviderID=0){const data=await api('./api/creative/options');state.models=Array.isArray(data.models)?data.models:[];state.credentials=Array.isArray(data.credentials)?data.credentials:[];$('balanceBadge').textContent='余额 '+money(data.balance);document.querySelectorAll('.topnav a.nav-extra').forEach(a=>a.style.display=data.is_admin?'inline-flex':'none');renderCredentials();fillModels(preferredProviderID)}
function initTheme(){let light=false;try{light=(localStorage.getItem('sub2api_ext_theme')||'')==='light'}catch{}document.documentElement.classList.toggle('light',light);$('themeBtn').textContent=light?'深色':'浅色';$('favicon').href=light?'./assets/ext-center-icon-light.svg':'./assets/ext-center-icon.svg'}
$('themeBtn').onclick=()=>{const light=!document.documentElement.classList.contains('light');document.documentElement.classList.toggle('light',light);$('themeBtn').textContent=light?'深色':'浅色';$('favicon').href=light?'./assets/ext-center-icon-light.svg':'./assets/ext-center-icon.svg';try{localStorage.setItem('sub2api_ext_theme',light?'light':'dark')}catch{}};
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>setMode(button.dataset.mode));$('creativePrompt').oninput=()=>{$('promptCount').textContent=$('creativePrompt').value.length+' / 4000'};$('modelSelect').onchange=syncModelControls;[$('ratioSelect'),$('resolutionSelect'),$('countSelect')].forEach(node=>node.onchange=updateEstimate);$('durationInput').oninput=updateEstimate;$('referenceInput').onchange=()=>readReference($('referenceInput').files[0]);$('removeReference').onclick=clearReference;$('submitBtn').onclick=()=>submitCreation().catch(error=>showMessage(error.message));
initTheme();state.token=findToken();if(!state.token){showMessage('请先登录 Sub2API 后再打开创作页面')}else{loadOptions().catch(error=>showMessage(error.message))}
</script>
</body>
