<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AI 创作中心 · Sub2API</title>
  <link id="favicon" rel="icon" href="./assets/ext-center-icon.svg" />
  <link rel="stylesheet" href="./assets/app.css" />
  <style>
    :root{--bg:var(--app-bg);--panel:var(--app-surface);--card:var(--app-surface);--soft:var(--app-surface-soft);--text:var(--app-text);--muted:var(--app-muted);--border:var(--app-border);--primary:var(--app-primary);--radius:var(--app-radius);--shadow:var(--app-shadow)}
    .creative-wrap{width:min(1180px,100%);margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.topnav{display:flex;flex-wrap:wrap}.topnav .nav-extra{display:none}.brand-title,.top-meta{display:flex;align-items:center}.brand-title .logo.light{display:none}html.light .brand-title .logo.dark{display:none}html.light .brand-title .logo.light{display:block}.brand-title h1{margin:0}.theme-btn,.badge{border:1px solid var(--border);background:var(--soft);color:var(--text);padding:8px 10px}.creative-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:14px;min-width:0}.creative-grid>*{min-width:0}.creative-card{box-sizing:border-box;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.creative-card h2{font-size:1.05rem;letter-spacing:0}.creative-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.creative-tabs button{width:auto;min-height:38px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--soft);color:var(--text);cursor:pointer}.creative-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{display:block;margin-bottom:6px;font-size:.86rem;font-weight:650}.field-full{grid-column:1/-1}.creative-card textarea,.creative-card input,.creative-card select{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:var(--radius);background:var(--soft);color:var(--text);padding:10px 12px}.creative-card textarea{min-height:120px;resize:vertical}.price-line{display:flex;justify-content:space-between;gap:12px;padding:12px;border-radius:var(--radius);background:var(--soft);margin:14px 0}.generate-btn{width:100%;border:0;border-radius:var(--radius);padding:12px;background:var(--primary);color:#fff;font-weight:750;cursor:pointer}.generate-btn:disabled{opacity:.55;cursor:not-allowed}.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.work{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--panel)}.work-media{aspect-ratio:16/10;border-radius:var(--radius);background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}.work-media img,.work-media video{width:100%;height:100%;object-fit:contain}.work-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work-meta{font-size:.76rem;color:var(--muted);margin-top:4px}.work-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.work-actions button{width:auto;padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--soft);color:var(--text);cursor:pointer}.status-processing{color:#d97706}.status-completed{color:#16a34a}.status-failed,.status-refunded{color:#dc2626}.empty{padding:30px;text-align:center;color:var(--muted)}.upload-preview{max-width:180px;max-height:120px;border-radius:var(--radius);margin-top:8px;display:none}@media(max-width:860px){.top{flex-direction:column}.top-meta{width:100%;justify-content:space-between}.creative-grid{grid-template-columns:minmax(0,1fr)}.form-grid{grid-template-columns:minmax(0,1fr)}.field-full{grid-column:auto}.works{grid-template-columns:minmax(0,1fr)}}@media(max-width:560px){.creative-wrap{width:calc(100vw - 16px);max-width:calc(100vw - 16px);margin:0}.top>div:first-child{width:100%;min-width:0}.topnav{width:100%;max-width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.topnav a{min-width:0;justify-content:center;text-align:center;white-space:nowrap}.creative-card{width:100%;max-width:100%;padding:14px}.creative-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.creative-tabs button{width:100%;min-width:0;padding-inline:8px}.price-line{align-items:center}}
  </style>
</head>
<body class="app-page app-creative">
<div class="creative-wrap">
  <header class="top">
    <div>
      <div class="topnav">
        <a href="./">每日签到</a><a href="./rank.html">排行榜</a><a href="./tasks.html">任务中心</a><a class="active" href="./create.html">AI 创作</a><a href="./rewards.html">奖励记录</a><a href="./tutorial.html">使用教程</a><a class="nav-extra" id="adminTopLink" href="./admin.html#creative">管理台</a>
      </div>
      <div class="brand-title"><img class="logo dark" src="./assets/ext-center-icon.svg" alt="" width="34" height="34"/><img class="logo light" src="./assets/ext-center-icon-light.svg" alt="" width="34" height="34"/><h1>AI 创作中心</h1></div>
      <p class="lead">文本生图 · 文本生视频 · 单图生视频</p>
    </div>
    <div class="top-meta"><button type="button" class="theme-btn" id="themeBtn">浅色</button><div class="badge" id="balanceBadge">余额 —</div></div>
  </header>

  <div class="creative-grid">
    <section class="creative-card">
      <div class="creative-tabs"><button class="active" data-tab="image">图片生成</button><button data-tab="video">视频生成</button></div>
      <div id="imagePane">
        <div class="form-grid">
          <div class="field-full"><label>提示词</label><textarea id="imagePrompt" placeholder="描述希望生成的图片"></textarea></div>
          <div><label>模型</label><select id="imageModel"></select></div><div><label>数量</label><select id="imageCount"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
          <div><label>比例</label><select id="imageRatio"><option>1:1</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option></select></div><div><label>分辨率</label><select id="imageResolution"><option>1k</option><option>2k</option></select></div>
        </div>
        <div class="price-line"><span>预计扣费</span><strong id="imagePrice">—</strong></div><button class="generate-btn" id="imageSubmit">生成图片</button>
      </div>
      <div id="videoPane" style="display:none">
        <div class="form-grid">
          <div class="field-full"><label>提示词</label><textarea id="videoPrompt" placeholder="描述希望生成的视频；上传参考图后提示词可简化"></textarea></div>
          <div><label>模型</label><select id="videoModel"></select></div><div><label>时长</label><input id="videoDuration" type="number" min="1" max="15" value="8"/></div>
          <div><label>比例</label><select id="videoRatio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option></select></div><div><label>分辨率</label><select id="videoResolution"><option>480p</option><option selected>720p</option></select></div>
          <div class="field-full"><label>参考图片（可选，最大 5MB）</label><input id="videoImage" type="file" accept="image/png,image/jpeg,image/webp"/><img id="uploadPreview" class="upload-preview" alt="参考图预览"/></div>
        </div>
        <div class="price-line"><span>预计扣费</span><strong id="videoPrice">—</strong></div><button class="generate-btn" id="videoSubmit">生成视频</button>
      </div>
      <div id="message" class="msg"></div>
    </section>

    <section class="creative-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px"><div><h2 style="margin:0">我的作品</h2><div class="sub">生成记录默认每页 10 条</div></div><button type="button" class="theme-btn" id="refreshWorks">刷新</button></div>
      <div id="works" class="works"><div class="empty">加载中…</div></div>
    </section>
  </div>
</div>
<script>
const AUTH_KEYS=['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];let token='';let models=[];let imageDataURL='';let workObjectURLs=[];let uploadLimitMB=5;
function cleanToken(v){v=(v||'').trim().replace(/^bearer\s+/i,'');return v.replace(/^["']|["']$/g,'')}
function findToken(){const q=cleanToken(new URLSearchParams(location.search).get('token'));if(q)return q;for(const k of AUTH_KEYS){try{const v=cleanToken(localStorage.getItem(k));if(v)return v}catch{}try{if(parent!==window){const v=cleanToken(parent.localStorage.getItem(k));if(v)return v}}catch{}}return ''}
function headers(json=true){const h={};if(token)h.Authorization='Bearer '+token;if(json)h['Content-Type']='application/json';return h}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers(opt.json!==false),...(opt.headers||{})}});const ct=r.headers.get('content-type')||'';const data=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error((data&&data.error)||data||('HTTP '+r.status));return data}
function money(v){return '$'+Number(v||0).toFixed(4)}
function currentModel(id){return models.find(m=>String(m.id)===String(id))}
function calcPrice(type){const prefix=type==='image'?'image':'video',m=currentModel(document.getElementById(prefix+'Model').value);if(!m)return 0;const p=m.pricing||{};const res=document.getElementById(prefix+'Resolution').value;const unit=(p.resolutions&&p.resolutions[res])||p.fixed||0;const qty=type==='image'?Number(imageCount.value):Number(videoDuration.value);return Math.round(unit*qty*10000)/10000}
function updatePrices(){imagePrice.textContent=money(calcPrice('image'));videoPrice.textContent=money(calcPrice('video'))}
function fillModels(){const image=models.filter(m=>m.capability==='image_generation'),video=models.filter(m=>m.capability==='video_generation');imageModel.innerHTML=image.map(m=>`<option value="${m.id}">${escapeHTML(m.display_name||m.model_id)} · ${escapeHTML(m.provider_name)}</option>`).join('')||'<option value="">暂无可用图片模型</option>';videoModel.innerHTML=video.map(m=>`<option value="${m.id}">${escapeHTML(m.display_name||m.model_id)} · ${escapeHTML(m.provider_name)}</option>`).join('')||'<option value="">暂无可用视频模型</option>';syncModelControls('image');syncModelControls('video');updatePrices()}
function replaceOptions(select,values,fallback){const current=select.value;const list=(Array.isArray(values)&&values.length?values:fallback);select.innerHTML=list.map(v=>`<option value="${escapeHTML(v)}">${escapeHTML(v)}</option>`).join('');if(list.includes(current))select.value=current}
function syncModelControls(type){const m=currentModel((type==='image'?imageModel:videoModel).value);if(!m)return;const c=m.constraints||{};if(type==='image'){replaceOptions(imageRatio,c.aspect_ratios,['1:1','16:9','9:16','4:3','3:4']);replaceOptions(imageResolution,c.resolutions,['1k','2k']);const current=Number(imageCount.value||1),max=Math.max(1,Math.min(10,Number(c.max_images||4)));imageCount.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');imageCount.value=String(Math.min(current,max))}else{replaceOptions(videoRatio,c.aspect_ratios,['16:9','9:16','1:1','4:3','3:4']);replaceOptions(videoResolution,c.resolutions,['480p','720p']);const min=Math.max(1,Number(c.duration_min||1)),max=Math.max(min,Number(c.duration_max||15));videoDuration.min=String(min);videoDuration.max=String(max);videoDuration.value=String(Math.max(min,Math.min(max,Number(videoDuration.value||8))));uploadLimitMB=Math.max(1,Math.min(5,Number(c.max_upload_mb||5)))}}
function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadOptions(){const d=await api('./api/creative/options');models=d.models||[];balanceBadge.textContent='余额 '+money(d.balance);fillModels();adminTopLink.style.display=d.is_admin?'inline-flex':'none'}
function reqKey(){return 'web_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)}
async function submitImage(){if(!imagePrompt.value.trim())throw new Error('请输入图片提示词');imageSubmit.disabled=true;try{const d=await api('./api/creative/images',{method:'POST',body:JSON.stringify({model_id:Number(imageModel.value),prompt:imagePrompt.value.trim(),n:Number(imageCount.value),aspect_ratio:imageRatio.value,resolution:imageResolution.value,request_key:reqKey()})});message.textContent='图片生成完成，已加入我的作品';await Promise.all([loadOptions(),loadWorks()]);return d}finally{imageSubmit.disabled=false}}
async function submitVideo(){if(!videoPrompt.value.trim()&&!imageDataURL)throw new Error('请输入视频提示词或上传参考图片');videoSubmit.disabled=true;try{await api('./api/creative/videos',{method:'POST',body:JSON.stringify({model_id:Number(videoModel.value),prompt:videoPrompt.value.trim(),duration:Number(videoDuration.value),aspect_ratio:videoRatio.value,resolution:videoResolution.value,image_data_url:imageDataURL,request_key:reqKey()})});message.textContent='视频任务已提交，可在我的作品查看进度';await Promise.all([loadOptions(),loadWorks()])}finally{videoSubmit.disabled=false}}
function statusText(v){return {processing:'生成中',completed:'已完成',failed:'失败',refunded:'失败已退款',created:'创建中'}[v]||v}
function workActions(j){if(j.status!=='completed')return '';const count=j.media_type==='image'?Math.max(1,Number(j.content_count||1)):1;return Array.from({length:count},(_,i)=>`<button onclick="viewWork(${j.id},'${j.media_type}',${i})">查看${count>1?i+1:''}</button><button onclick="downloadWork(${j.id},'${j.media_type}',${i})">下载${count>1?i+1:''}</button>`).join('')}
async function loadWorks(){workObjectURLs.forEach(URL.revokeObjectURL);workObjectURLs=[];const d=await api('./api/creative/jobs?page=1&page_size=10');const items=d.items||[];if(!items.length){works.innerHTML='<div class="empty">暂无作品</div>';return}works.innerHTML=items.map(j=>`<article class="work"><div class="work-media" id="media-${j.id}">${j.status==='completed'?'点击查看作品':escapeHTML(statusText(j.status))+' '+Number(j.progress||0)+'%'}</div><div class="work-title" title="${escapeHTML(j.prompt)}">${escapeHTML(j.prompt||j.model_id)}</div><div class="work-meta">${escapeHTML(j.model_id)} · ${money(j.charge_amount)} · <span class="status-${j.status}">${escapeHTML(statusText(j.status))}</span></div><div class="work-actions">${workActions(j)}</div>${j.error_message?`<div class="work-meta">${escapeHTML(j.error_message)}</div>`:''}</article>`).join('');if(items.some(j=>j.status==='processing'))setTimeout(loadWorks,5000)}
async function contentBlob(id,index){const r=await fetch(`./api/creative/jobs/${id}/content?index=${index}`,{headers:headers(false)});if(!r.ok)throw new Error(await r.text());return r.blob()}
async function viewWork(id,type,index){try{const blob=await contentBlob(id,index);const u=URL.createObjectURL(blob);workObjectURLs.push(u);const box=document.getElementById('media-'+id);box.innerHTML=type==='video'?`<video src="${u}" controls autoplay></video>`:`<img src="${u}" alt="生成图片"/>`}catch(e){message.textContent=e.message}}
async function downloadWork(id,type,index){try{const blob=await contentBlob(id,index);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`creative-${id}.${type==='video'?'mp4':'png'}`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){message.textContent=e.message}}
function initTheme(){let light=false;try{light=(localStorage.getItem('sub2api_ext_theme')||'')==='light'}catch{};document.documentElement.classList.toggle('light',light);themeBtn.textContent=light?'深色':'浅色'}
themeBtn.onclick=()=>{const light=!document.documentElement.classList.contains('light');document.documentElement.classList.toggle('light',light);themeBtn.textContent=light?'深色':'浅色';try{localStorage.setItem('sub2api_ext_theme',light?'light':'dark')}catch{}};
document.querySelectorAll('.creative-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.creative-tabs button').forEach(x=>x.classList.toggle('active',x===b));imagePane.style.display=b.dataset.tab==='image'?'block':'none';videoPane.style.display=b.dataset.tab==='video'?'block':'none'});
[imageCount,imageResolution,videoDuration,videoResolution].forEach(x=>x.addEventListener('change',updatePrices));imageModel.addEventListener('change',()=>{syncModelControls('image');updatePrices()});videoModel.addEventListener('change',()=>{syncModelControls('video');updatePrices()});videoDuration.addEventListener('input',updatePrices);imageSubmit.onclick=()=>submitImage().catch(e=>message.textContent=e.message);videoSubmit.onclick=()=>submitVideo().catch(e=>message.textContent=e.message);refreshWorks.onclick=()=>loadWorks().catch(e=>message.textContent=e.message);videoImage.onchange=()=>{const f=videoImage.files[0];if(!f){imageDataURL='';uploadPreview.style.display='none';return}if(f.size>uploadLimitMB*1024*1024){message.textContent='参考图片不能超过 '+uploadLimitMB+'MB';videoImage.value='';return}const r=new FileReader();r.onload=()=>{imageDataURL=String(r.result);uploadPreview.src=imageDataURL;uploadPreview.style.display='block'};r.readAsDataURL(f)};
initTheme();token=findToken();if(!token){message.textContent='请先登录 Sub2API 后再打开创作中心';works.innerHTML='<div class="empty">未登录</div>'}else{Promise.all([loadOptions(),loadWorks()]).catch(e=>message.textContent=e.message)}
</script>
</body></html>
