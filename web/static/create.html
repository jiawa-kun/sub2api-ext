<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AI 创作中心 · Sub2API</title>
  <link id="favicon" rel="icon" href="./assets/ext-center-icon.svg" />
  <link rel="stylesheet" href="./assets/app.css" />
  <style>
    :root{--bg:var(--app-bg);--surface:var(--app-surface);--raised:var(--app-surface-raised);--soft:var(--app-surface-soft);--text:var(--app-text);--muted:var(--app-muted);--border:var(--app-border);--strong:var(--app-border-strong);--primary:var(--app-primary);--success:var(--app-success);--warning:var(--app-warning);--danger:var(--app-danger);--radius:var(--app-radius);--shadow:var(--app-shadow)}
    body.app-creative{padding-bottom:40px}.creative-wrap{width:min(1320px,100%);margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.topnav{display:flex;flex-wrap:wrap}.topnav .nav-extra{display:none}.brand-title,.top-meta{display:flex;align-items:center}.brand-title .logo.light{display:none}html.light .brand-title .logo.dark{display:none}html.light .brand-title .logo.light{display:block}.top-meta{gap:8px}.icon-btn{width:38px;height:38px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:var(--radius);background:var(--soft);color:var(--text);box-shadow:none;font-size:1rem}.balance-badge{min-height:38px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--soft);font-size:.8rem;font-weight:700;white-space:nowrap}.studio-layout{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:16px;align-items:start;min-width:0}.studio-tool{position:sticky;top:14px;min-width:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px;border-bottom:1px solid var(--border);background:var(--soft)}.mode-tabs button{min-height:40px;border:0;border-radius:var(--radius);background:transparent;color:var(--muted);box-shadow:none}.mode-tabs button.active{background:var(--raised);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}.tool-body{padding:18px}.field{margin:0 0 14px}.field label,.field-label{display:block;margin:0 0 6px;color:var(--text);font-size:.78rem;font-weight:700}.field textarea,.field select,.field input{width:100%;box-sizing:border-box}.prompt-wrap{position:relative}.prompt-wrap textarea{min-height:126px;padding-bottom:34px;resize:vertical;line-height:1.55}.prompt-count{position:absolute;right:10px;bottom:9px;color:var(--muted);font-size:.68rem}.model-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.model-health{min-width:70px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius);background:var(--soft);color:var(--muted);font-size:.7rem;font-weight:700}.model-health.ok{color:var(--success)}.control-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.upload-box{position:relative;min-height:86px;display:flex;align-items:center;gap:12px;padding:10px;border:1px dashed var(--strong);border-radius:var(--radius);background:var(--soft)}.upload-box.has-image{border-style:solid}.upload-box input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.upload-trigger{min-height:38px;display:inline-flex;align-items:center;padding:7px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:.76rem;font-weight:700;cursor:pointer}.upload-copy{min-width:0;color:var(--muted);font-size:.7rem;line-height:1.45}.upload-preview{display:none;width:64px;height:64px;object-fit:cover;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}.upload-box.has-image .upload-preview{display:block}.upload-box.has-image .upload-trigger{display:none}.upload-remove{display:none;position:absolute;right:7px;top:7px;width:28px;height:28px;min-height:28px;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);box-shadow:none}.upload-box.has-image .upload-remove{display:grid;place-items:center}.price-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.price-panel span{color:var(--muted);font-size:.75rem}.price-panel strong{font-size:1.08rem;font-variant-numeric:tabular-nums}.submit-btn{width:100%;min-height:44px;margin-top:14px;border:1px solid var(--primary);border-radius:var(--radius);background:var(--primary);color:#fff;font-weight:750;cursor:pointer}.submit-btn:disabled{opacity:.5;cursor:not-allowed}.message{display:none;margin-top:12px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius);font-size:.76rem;line-height:1.45}.message.show{display:block}.message.ok{color:var(--success);border-color:color-mix(in srgb,var(--success) 35%,transparent);background:color-mix(in srgb,var(--success) 8%,transparent)}.message.err{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}.library{min-width:0}.library-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.library-head h2,.library-head p{margin:0}.library-head h2{font-size:1.05rem}.library-head p{margin-top:4px;color:var(--muted);font-size:.75rem}.library-actions{display:flex;align-items:center;gap:8px}.filter-tabs{display:flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:var(--radius);background:var(--soft)}.filter-tabs button{min-height:32px;padding:5px 10px;border:0;border-radius:var(--radius);background:transparent;color:var(--muted);box-shadow:none;font-size:.72rem}.filter-tabs button.active{background:var(--surface);color:var(--text)}.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0}.work{min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}.work-media{position:relative;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--soft);color:var(--muted);font-size:.76rem}.work-media img,.work-media video{width:100%;height:100%;object-fit:contain;background:#05070b}.work-status{position:absolute;left:8px;top:8px;z-index:2;padding:4px 7px;border:1px solid var(--border);border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 92%,transparent);font-size:.66rem;font-weight:700}.work-status.completed{color:var(--success)}.work-status.processing,.work-status.created{color:var(--warning)}.work-status.failed,.work-status.refunded{color:var(--danger)}.progress-track{position:absolute;left:14%;right:14%;bottom:18px;height:4px;overflow:hidden;border-radius:3px;background:var(--border)}.progress-track i{display:block;height:100%;background:var(--primary)}.work-body{padding:12px}.work-title{min-height:38px;display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:.82rem;font-weight:700;line-height:1.4;overflow-wrap:anywhere}.work-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;color:var(--muted);font-size:.68rem}.work-meta span{padding-right:6px;border-right:1px solid var(--border)}.work-meta span:last-child{border-right:0}.work-actions{display:flex;align-items:center;gap:6px;margin-top:10px}.work-actions button{min-height:32px;padding:5px 9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--soft);color:var(--text);box-shadow:none;font-size:.7rem}.work-error{margin-top:8px;color:var(--danger);font-size:.7rem;line-height:1.4;overflow-wrap:anywhere}.empty-state{grid-column:1/-1;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed var(--strong);border-radius:var(--radius);color:var(--muted);text-align:center}.empty-mark{width:46px;height:46px;display:grid;place-items:center;margin-bottom:10px;border:1px solid var(--border);border-radius:50%;background:var(--soft);font-size:1.2rem}.empty-state strong{color:var(--text);font-size:.86rem}.empty-state span{margin-top:5px;font-size:.72rem}.hidden{display:none!important}
    @media(max-width:980px){.studio-layout{grid-template-columns:minmax(330px,390px) minmax(0,1fr)}.works{grid-template-columns:minmax(0,1fr)}}
    @media(max-width:760px){body.app-creative{padding:12px 10px 32px}.top{flex-direction:column}.top-meta{width:100%;justify-content:space-between}.studio-layout{grid-template-columns:minmax(0,1fr)}.studio-tool{position:static}.library-head{align-items:flex-start;flex-direction:column}.library-actions{width:100%;justify-content:space-between}.works{grid-template-columns:minmax(0,1fr)}}
    @media(max-width:520px){.creative-wrap{width:100%;max-width:100%}.topnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}.topnav a{min-width:0;justify-content:center;white-space:nowrap}.tool-body{padding:14px}.control-grid{grid-template-columns:minmax(0,1fr)}.model-line{grid-template-columns:minmax(0,1fr)}.model-health{min-height:34px}.filter-tabs{flex:1}.filter-tabs button{flex:1}.work-media{aspect-ratio:4/3}}
  </style>
</head>
<body class="app-page app-creative">
<div class="creative-wrap">
  <header class="top">
    <div>
      <nav class="topnav">
        <a href="./">每日签到</a><a href="./rank.html">排行榜</a><a href="./tasks.html">任务中心</a><a class="active" href="./create.html">AI 创作</a><a href="./rewards.html">奖励记录</a><a href="./tutorial.html">使用教程</a><a class="nav-extra" id="adminTopLink" href="./admin.html#creative">管理台</a>
      </nav>
      <div class="brand-title"><img class="logo dark" src="./assets/ext-center-icon.svg" alt="" width="34" height="34"/><img class="logo light" src="./assets/ext-center-icon-light.svg" alt="" width="34" height="34"/><h1>AI 创作中心</h1></div>
      <p class="lead">图片生成 · 图片编辑 · 视频生成</p>
    </div>
    <div class="top-meta"><button type="button" class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">◐</button><div class="balance-badge" id="balanceBadge">余额 —</div></div>
  </header>

  <main class="studio-layout">
    <section class="studio-tool" aria-label="创作工具">
      <div class="mode-tabs" role="tablist"><button type="button" class="active" data-mode="image">图片</button><button type="button" data-mode="video">视频</button></div>
      <div class="tool-body">
        <div class="field">
          <label for="creativePrompt">提示词</label>
          <div class="prompt-wrap"><textarea id="creativePrompt" maxlength="4000" placeholder="描述画面内容、风格和构图"></textarea><span class="prompt-count" id="promptCount">0 / 4000</span></div>
        </div>
        <div class="field">
          <label for="modelSelect">模型</label>
          <div class="model-line"><select id="modelSelect"></select><div class="model-health" id="modelHealth">—</div></div>
        </div>
        <div class="control-grid">
          <div class="field"><label for="ratioSelect">比例</label><select id="ratioSelect"></select></div>
          <div class="field"><label for="resolutionSelect">分辨率</label><select id="resolutionSelect"></select></div>
          <div class="field" id="countField"><label for="countSelect">数量</label><select id="countSelect"></select></div>
          <div class="field hidden" id="durationField"><label for="durationInput">时长（秒）</label><input id="durationInput" type="number" min="1" max="15" value="8" /></div>
        </div>
        <div class="field">
          <span class="field-label">参考图</span>
          <div class="upload-box" id="uploadBox">
            <input id="referenceInput" type="file" accept="image/png,image/jpeg,image/webp" />
            <img class="upload-preview" id="referencePreview" alt="参考图预览" />
            <label class="upload-trigger" for="referenceInput">选择图片</label>
            <div class="upload-copy" id="uploadCopy">PNG、JPEG 或 WebP，最大 5MB</div>
            <button type="button" class="upload-remove" id="removeReference" title="移除参考图" aria-label="移除参考图">×</button>
          </div>
        </div>
        <div class="price-panel"><span id="priceLabel">预计扣费</span><strong id="priceValue">$0.0000</strong></div>
        <button type="button" class="submit-btn" id="submitBtn">生成图片</button>
        <div class="message" id="message"></div>
      </div>
    </section>

    <section class="library" aria-label="我的作品">
      <div class="library-head">
        <div><h2>我的作品</h2><p id="workSummary">最近 10 条创作记录</p></div>
        <div class="library-actions"><div class="filter-tabs" role="tablist"><button type="button" class="active" data-filter="all">全部</button><button type="button" data-filter="image">图片</button><button type="button" data-filter="video">视频</button></div><button type="button" class="icon-btn" id="refreshWorks" title="刷新作品" aria-label="刷新作品">↻</button></div>
      </div>
      <div class="works" id="works"><div class="empty-state"><span>加载中…</span></div></div>
    </section>
  </main>
</div>
<script>
const AUTH_KEYS=['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];
const state={token:'',mode:'image',filter:'all',models:[],jobs:[],reference:'',objectURLs:[],uploadLimitMB:5,pollTimer:0};
const $=id=>document.getElementById(id);
function cleanToken(v){v=(v||'').trim().replace(/^bearer\s+/i,'');return v.replace(/^["']|["']$/g,'')}
function findToken(){const q=cleanToken(new URLSearchParams(location.search).get('token'));if(q)return q;for(const k of AUTH_KEYS){try{const v=cleanToken(localStorage.getItem(k));if(v)return v}catch{}try{if(parent!==window){const v=cleanToken(parent.localStorage.getItem(k));if(v)return v}}catch{}}return ''}
function headers(json=true){const h={};if(state.token)h.Authorization='Bearer '+state.token;if(json)h['Content-Type']='application/json';return h}
async function api(path,opt={}){const response=await fetch(path,{...opt,headers:{...headers(opt.json!==false),...(opt.headers||{})}});const contentType=response.headers.get('content-type')||'';const data=contentType.includes('json')?await response.json():await response.text();if(!response.ok)throw new Error((data&&data.error)||data||('HTTP '+response.status));return data}
function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '$'+Number(v||0).toFixed(4)}
function currentModel(){return state.models.find(model=>String(model.id)===String($('modelSelect').value))}
function modelsForMode(){return state.models.filter(model=>model.capability===(state.mode==='image'?'image_generation':'video_generation'))}
function showMessage(text,type='err'){const node=$('message');node.textContent=text;node.className='message show '+type}
function clearMessage(){const node=$('message');node.textContent='';node.className='message'}
function replaceOptions(select,values,fallback){const previous=select.value;const list=Array.isArray(values)&&values.length?values:fallback;select.innerHTML=list.map(value=>`<option value="${escapeHTML(value)}">${escapeHTML(value)}</option>`).join('');if(list.includes(previous))select.value=previous}
function priceForModel(model){if(!model)return 0;const pricing=model.pricing||{},resolution=$('resolutionSelect').value;const unit=Number((pricing.resolutions&&pricing.resolutions[resolution])||pricing.fixed||0);const quantity=state.mode==='image'?Number($('countSelect').value||1):Number($('durationInput').value||1);let total=unit*quantity;if(state.mode==='image'&&state.reference)total+=Number(pricing.input_image||0);return Math.round(total*10000)/10000}
function syncModelControls(){
  const model=currentModel(),constraints=model?.constraints||{};
  if(!model){$('modelHealth').textContent='不可用';$('modelHealth').classList.remove('ok');$('submitBtn').disabled=true;$('priceValue').textContent='$0.0000';return}
  $('modelHealth').textContent=Number(model.available_accounts)>0?Number(model.available_accounts)+' 个账号':'可用';$('modelHealth').classList.add('ok');
  replaceOptions($('ratioSelect'),constraints.aspect_ratios,state.mode==='image'?['1:1','16:9','9:16','4:3','3:4']:['16:9','9:16','1:1']);
  replaceOptions($('resolutionSelect'),constraints.resolutions,state.mode==='image'?['1k','2k']:['480p','720p']);
  if(state.mode==='image'){
    const count=Math.max(1,Math.min(10,Number(constraints.max_images||4))),current=Math.max(1,Number($('countSelect').value||1));
    $('countSelect').innerHTML=Array.from({length:count},(_,index)=>`<option value="${index+1}">${index+1} 张</option>`).join('');$('countSelect').value=String(Math.min(current,count));
    $('uploadCopy').textContent=constraints.supports_edit?'上传后自动切换为图片编辑':'当前模型不支持图片编辑';
  }else{
    const min=Math.max(1,Number(constraints.duration_min||1)),max=Math.max(min,Number(constraints.duration_max||15));$('durationInput').min=String(min);$('durationInput').max=String(max);$('durationInput').value=String(Math.max(min,Math.min(max,Number($('durationInput').value||8))));$('uploadCopy').textContent='PNG、JPEG 或 WebP，最大 '+Math.min(5,Number(constraints.max_upload_mb||5))+'MB';
  }
  state.uploadLimitMB=Math.max(1,Math.min(5,Number(constraints.max_upload_mb||5)));
  updateEstimate();
}
function fillModels(){const available=modelsForMode(),previous=$('modelSelect').value;$('modelSelect').innerHTML=available.map(model=>`<option value="${model.id}">${escapeHTML(model.display_name||model.model_id)} · ${escapeHTML(model.provider_name||'')}</option>`).join('')||'<option value="">暂无可用模型</option>';if(available.some(model=>String(model.id)===previous))$('modelSelect').value=previous;syncModelControls()}
function updateEstimate(){const model=currentModel(),supportsEdit=!!model?.constraints?.supports_edit,invalidEdit=state.mode==='image'&&state.reference&&!supportsEdit;$('priceValue').textContent=money(priceForModel(model));$('priceLabel').textContent=state.mode==='image'&&state.reference?'图片编辑扣费':'预计扣费';$('submitBtn').textContent=state.mode==='video'?'生成视频':state.reference?'编辑图片':'生成图片';$('submitBtn').disabled=!model||invalidEdit;if(invalidEdit)showMessage('当前模型不支持图片编辑，请移除参考图或更换模型')}
function setMode(mode){state.mode=mode==='video'?'video':'image';document.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===state.mode));$('countField').classList.toggle('hidden',state.mode==='video');$('durationField').classList.toggle('hidden',state.mode==='image');clearReference();clearMessage();fillModels()}
function clearReference(){$('referenceInput').value='';$('referencePreview').removeAttribute('src');$('uploadBox').classList.remove('has-image');state.reference='';updateEstimate()}
function readReference(file){if(!file){clearReference();return}if(!/^image\/(png|jpeg|webp)$/i.test(file.type)){showMessage('请选择 PNG、JPEG 或 WebP 图片');clearReference();return}if(file.size>state.uploadLimitMB*1024*1024){showMessage('参考图片不能超过 '+state.uploadLimitMB+'MB');clearReference();return}const reader=new FileReader();reader.onload=()=>{state.reference=String(reader.result);$('referencePreview').src=state.reference;$('uploadBox').classList.add('has-image');clearMessage();updateEstimate()};reader.readAsDataURL(file)}
function requestKey(){return 'web_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)}
async function submitCreation(){
  const model=currentModel(),prompt=$('creativePrompt').value.trim();if(!model)throw new Error('暂无可用模型');if(!prompt&&!(state.mode==='video'&&state.reference))throw new Error('请输入提示词');
  const button=$('submitBtn');button.disabled=true;clearMessage();
  try{
    if(state.mode==='image') await api('./api/creative/images',{method:'POST',body:JSON.stringify({model_id:Number(model.id),prompt,n:Number($('countSelect').value),aspect_ratio:$('ratioSelect').value,resolution:$('resolutionSelect').value,image_data_url:state.reference,request_key:requestKey()})});
    else await api('./api/creative/videos',{method:'POST',body:JSON.stringify({model_id:Number(model.id),prompt,duration:Number($('durationInput').value),aspect_ratio:$('ratioSelect').value,resolution:$('resolutionSelect').value,image_data_url:state.reference,request_key:requestKey()})});
    showMessage(state.mode==='image'?'图片已生成':'视频任务已提交','ok');clearReference();await Promise.all([loadOptions(),loadWorks()]);
  }finally{button.disabled=false;updateEstimate()}
}
async function loadOptions(){const data=await api('./api/creative/options');state.models=Array.isArray(data.models)?data.models:[];$('balanceBadge').textContent='余额 '+money(data.balance);$('adminTopLink').style.display=data.is_admin?'inline-flex':'none';fillModels()}
function statusText(value){return ({created:'排队中',processing:'生成中',completed:'已完成',failed:'生成失败',refunded:'失败已退款'})[value]||value||'—'}
function dateText(value){const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function workButtons(job){if(job.status!=='completed')return '';const count=job.media_type==='image'?Math.max(1,Number(job.content_count||1)):1;return Array.from({length:count},(_,index)=>`<button type="button" onclick="viewWork(${job.id},'${job.media_type}',${index})">${job.media_type==='video'?'播放':'查看'}${count>1?' '+(index+1):''}</button><button type="button" onclick="downloadWork(${job.id},'${job.media_type}',${index})">下载${count>1?' '+(index+1):''}</button>`).join('')}
function renderWorks(){
  const items=state.filter==='all'?state.jobs:state.jobs.filter(job=>job.media_type===state.filter);$('workSummary').textContent='最近 '+state.jobs.length+' 条创作记录';
  if(!items.length){$('works').innerHTML='<div class="empty-state"><div class="empty-mark">＋</div><strong>暂无作品</strong><span>完成一次创作后会显示在这里</span></div>';return}
  $('works').innerHTML=items.map(job=>`<article class="work"><div class="work-media" id="media-${job.id}"><span class="work-status ${escapeHTML(job.status)}">${escapeHTML(statusText(job.status))}</span>${job.status==='completed'?(job.media_type==='image'?'正在加载预览…':'点击下方按钮播放'):escapeHTML(statusText(job.status))}${job.status==='processing'?`<div class="progress-track"><i style="width:${Math.max(2,Math.min(100,Number(job.progress||0)))}%"></i></div>`:''}</div><div class="work-body"><div class="work-title" title="${escapeHTML(job.prompt)}">${escapeHTML(job.prompt||job.model_id)}</div><div class="work-meta"><span>${escapeHTML(job.model_id)}</span><span>${money(job.charge_amount)}</span><span>${dateText(job.created_at)}</span></div><div class="work-actions">${workButtons(job)}</div>${job.error_message?`<div class="work-error">${escapeHTML(job.error_message)}</div>`:''}</div></article>`).join('');
  items.filter(job=>job.status==='completed'&&job.media_type==='image').slice(0,8).forEach(job=>viewWork(job.id,'image',0,true));
}
async function loadWorks(){clearTimeout(state.pollTimer);state.objectURLs.forEach(URL.revokeObjectURL);state.objectURLs=[];const data=await api('./api/creative/jobs?page=1&page_size=10');state.jobs=Array.isArray(data.items)?data.items:[];renderWorks();if(state.jobs.some(job=>job.status==='processing'||job.status==='created'))state.pollTimer=setTimeout(()=>loadWorks().catch(error=>showMessage(error.message)),5000)}
async function contentBlob(id,index){const response=await fetch(`./api/creative/jobs/${id}/content?index=${index}`,{headers:headers(false)});if(!response.ok)throw new Error(await response.text());return response.blob()}
async function viewWork(id,type,index,silent=false){try{const blob=await contentBlob(id,index),url=URL.createObjectURL(blob);state.objectURLs.push(url);const box=$('media-'+id);if(!box)return;const badge=box.querySelector('.work-status')?.outerHTML||'';box.innerHTML=badge+(type==='video'?`<video src="${url}" controls autoplay playsinline></video>`:`<img src="${url}" alt="生成图片"/>`)}catch(error){if(!silent)showMessage(error.message)}}
async function downloadWork(id,type,index){try{const blob=await contentBlob(id,index),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`creative-${id}-${index+1}.${type==='video'?'mp4':'png'}`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(error){showMessage(error.message)}}
function initTheme(){let light=false;try{light=(localStorage.getItem('sub2api_ext_theme')||'')==='light'}catch{}document.documentElement.classList.toggle('light',light);$('themeBtn').title=light?'切换到深色':'切换到浅色'}
$('themeBtn').onclick=()=>{const light=!document.documentElement.classList.contains('light');document.documentElement.classList.toggle('light',light);$('themeBtn').title=light?'切换到深色':'切换到浅色';try{localStorage.setItem('sub2api_ext_theme',light?'light':'dark')}catch{}};
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>setMode(button.dataset.mode));document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{state.filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===button));renderWorks()});
$('creativePrompt').oninput=()=>{$('promptCount').textContent=$('creativePrompt').value.length+' / 4000'};$('modelSelect').onchange=syncModelControls;[$('ratioSelect'),$('resolutionSelect'),$('countSelect')].forEach(node=>node.onchange=updateEstimate);$('durationInput').oninput=updateEstimate;$('referenceInput').onchange=()=>readReference($('referenceInput').files[0]);$('removeReference').onclick=clearReference;$('submitBtn').onclick=()=>submitCreation().catch(error=>showMessage(error.message));$('refreshWorks').onclick=()=>loadWorks().catch(error=>showMessage(error.message));
initTheme();state.token=findToken();if(!state.token){showMessage('请先登录 Sub2API 后再打开创作中心');$('works').innerHTML='<div class="empty-state"><strong>未登录</strong></div>'}else{Promise.all([loadOptions(),loadWorks()]).catch(error=>showMessage(error.message))}
</script>
</body>
