    body.app-creative{background:var(--app-bg);overflow-x:hidden}
    body.app-creative .creative-shell{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 80px)}
    .credential-trigger.ok{color:var(--success)}.balance-badge{cursor:default;font-variant-numeric:tabular-nums}
    .studio-controls{min-height:42px;display:flex;align-items:center;padding:0 2px}
    .workspace-stage{position:relative;min-height:calc(100vh - 236px);padding:32px 32px 228px;display:flex;align-items:center;justify-content:center}.workspace-stage:has(.result-state:not(.hidden)){align-items:flex-start;padding-top:40px}.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;max-width:540px;color:var(--muted);text-align:center}.empty-state svg{width:30px;height:30px;opacity:.62}.empty-state strong{color:var(--text);font-size:clamp(1.05rem,2vw,1.45rem);font-weight:650;letter-spacing:0}.empty-state span{font-size:.78rem;line-height:1.55}
    .result-state{width:100%;max-width:960px;flex:0 0 auto;display:flex;flex-direction:column;gap:12px}.result-head,.result-foot{display:flex;align-items:center;justify-content:space-between;gap:14px}.result-copy{min-width:0}.result-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}.result-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px;color:var(--muted);font-size:.7rem}.result-meta span+span::before{margin-right:7px;content:"·"}.result-status{flex:none;color:var(--muted);font-size:.72rem}.result-status.ok{color:var(--success)}.result-status.warn{color:var(--warning)}.result-status.bad{color:var(--danger)}
    .result-media{min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden}.result-media.images{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.result-media.images.multi{grid-template-columns:repeat(2,minmax(0,1fr))}.media-item{position:relative;min-width:0;display:flex;align-items:center;justify-content:center}.media-item img{display:block;max-width:100%;max-height:68vh;border-radius:var(--tool-radius);object-fit:contain;background:#05070b}.media-actions{position:absolute;right:9px;bottom:9px;display:flex;gap:6px}.media-actions a{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);border-radius:6px;background:rgba(5,7,11,.72);color:#fff;backdrop-filter:blur(10px)}.media-actions svg{width:16px;height:16px}.result-media video{display:block;max-width:100%;max-height:68vh;border-radius:var(--tool-radius);background:#05070b}.result-pending{width:min(560px,100%);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center}.result-pending strong{color:var(--text);font-size:1rem}.pending-ring{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}.progress-line{width:min(360px,80%);height:4px;overflow:hidden;border-radius:4px;background:var(--border)}.progress-line i{display:block;height:100%;background:var(--primary);transition:width .3s ease}.result-error{width:min(620px,100%);padding:18px;border:1px solid color-mix(in srgb,var(--danger) 38%,transparent);border-radius:var(--tool-radius);background:color-mix(in srgb,var(--danger) 7%,transparent);color:var(--danger);font-size:.82rem;line-height:1.6;text-align:center}.result-foot{min-height:36px}.result-index{color:var(--muted);font-size:.72rem}.result-link{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-size:.74rem;font-weight:700;text-decoration:none}.result-link svg{width:15px;height:15px}
    .composer{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:25;width:min(1160px,calc(100vw - 48px));transform:translateX(-50%);padding:14px 14px 12px;border:1px solid var(--strong);border-radius:var(--tool-radius);background:color-mix(in srgb,var(--surface) 96%,transparent);box-shadow:0 18px 55px rgba(0,0,0,.2);backdrop-filter:blur(18px)}.composer textarea{width:100%;min-height:76px;max-height:190px;padding:2px 4px 8px;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:var(--text);font-size:.92rem;line-height:1.55;resize:none}.composer textarea:focus{outline:0}.composer-info{min-height:22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.composer-message{min-width:0;color:var(--danger);font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.composer-message.ok{color:var(--success)}.prompt-count{flex:none;color:var(--muted);font-size:.66rem}
    .reference-chip{display:none;align-items:center;gap:8px;width:max-content;max-width:100%;margin:3px 0 8px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--soft)}.reference-chip.show{display:flex}.reference-chip img{width:32px;height:32px;border-radius:4px;object-fit:cover}.reference-chip span{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.68rem}.reference-chip button{width:26px;height:26px;min-height:26px;padding:0;border:0!important;background:transparent!important;color:var(--muted)!important;box-shadow:none!important}
    .composer-toolbar{display:flex;align-items:center;gap:7px;min-width:0}.compact-control{position:relative;display:flex;align-items:center;min-width:0}.compact-control svg{position:absolute;left:8px;width:14px;height:14px;color:var(--muted);pointer-events:none}.compact-control select,.duration-control{min-height:34px;padding:5px 28px 5px 27px;border-color:transparent!important;background:var(--soft)!important;font-size:.7rem;box-shadow:none!important}.model-control{flex:1 1 230px;max-width:310px}.model-control select{width:100%}.option-control{flex:0 1 auto}.reference-button{min-height:34px;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid transparent;border-radius:6px;background:var(--soft);color:var(--text);font-size:.7rem;font-weight:650;cursor:pointer;white-space:nowrap}.reference-button svg{width:14px;height:14px}.reference-button input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.model-health{flex:none;min-width:70px;color:var(--success);font-size:.68rem;text-align:center;white-space:nowrap}.price-value{margin-left:auto;color:var(--text);font-size:.78rem;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}.submit-button{width:38px;height:38px;min-height:38px;padding:0;border-radius:50%!important;display:grid;place-items:center}.submit-button svg{width:17px;height:17px}.submit-button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}
    .credential-dialog{width:min(680px,calc(100vw - 28px));max-width:none;padding:0;border:1px solid var(--border);border-radius:var(--tool-radius);background:var(--surface);color:var(--text);box-shadow:0 28px 90px rgba(0,0,0,.42)}.credential-dialog::backdrop{background:rgba(3,7,18,.7)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}.dialog-head h2{margin:0;font-size:.96rem}.dialog-close{width:34px;height:34px;min-height:34px;padding:0!important}.credential-list{display:grid;gap:12px;padding:16px}.credential-item{padding:12px;border:1px solid var(--border);border-radius:var(--tool-radius);background:var(--soft)}.credential-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:.72rem}.credential-meta span{color:var(--muted)}.credential-controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px}.credential-controls input{min-width:0}.credential-controls button{white-space:nowrap}.credential-message{min-height:20px;padding:0 16px 14px;color:var(--danger);font-size:.72rem}.credential-message.ok{color:var(--success)}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:860px){.workspace-stage{min-height:calc(100vh - 318px);padding:28px 18px 250px}.composer{width:calc(100vw - 24px);bottom:max(10px,env(safe-area-inset-bottom))}.composer-toolbar{flex-wrap:wrap}.model-control{flex:1 1 calc(100% - 90px);max-width:none}.model-health{order:2}.reference-button{order:3}.option-control{order:4}.price-value{order:5;margin-left:auto}.submit-button{order:6}.result-media.images.multi{grid-template-columns:minmax(0,1fr)}.media-item img,.result-media video{max-height:58vh}}
    @media(max-width:520px){.studio-controls{justify-content:center}.mode-switch{width:100%}.mode-switch .mode-button{flex:1;padding:6px 9px}.balance-badge .balance-label{display:none}.workspace-stage{min-height:460px;padding:24px 12px 285px}.workspace-stage:has(.result-state:not(.hidden)){padding-top:28px}.result-head{align-items:flex-start;flex-direction:column}.result-media{min-height:240px}.result-media.images.multi{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}.result-media.images.multi .media-item{flex:0 0 100%;scroll-snap-align:start}.composer{padding:11px 10px 10px}.composer textarea{min-height:68px;font-size:.86rem}.model-control{flex-basis:100%;max-width:100%}.model-health{display:none}.compact-control select{max-width:112px}.model-control select{max-width:none!important}.credential-controls{grid-template-columns:repeat(2,minmax(0,1fr))}.credential-controls input{grid-column:1/-1}.credential-controls button{width:100%}}
  </style>

<script>
const AUTH_KEYS=['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];
const state={token:'',mode:'image',models:[],credentials:[],reference:'',referenceName:'',uploadLimitMB:5,resultJob:null,resultURLs:[],pollTimer:0};
const $=id=>document.getElementById(id);
function cleanToken(v){v=(v||'').trim().replace(/^bearer\s+/i,'');return v.replace(/^["']|["']$/g,'')}
function findToken(){const q=cleanToken(new URLSearchParams(location.search).get('token'));if(q)return q;for(const k of AUTH_KEYS){try{const v=cleanToken(localStorage.getItem(k));if(v)return v}catch{}try{if(parent!==window){const v=cleanToken(parent.localStorage.getItem(k));if(v)return v}}catch{}}return ''}
function headers(json=true){const h={};if(state.token)h.Authorization='Bearer '+state.token;if(json)h['Content-Type']='application/json';return h}
async function api(path,opt={}){const response=await fetch(path,{...opt,headers:{...headers(opt.json!==false),...(opt.headers||{})}});const contentType=response.headers.get('content-type')||'';const data=contentType.includes('json')?await response.json():await response.text();if(!response.ok)throw new Error((data&&data.error)||data||('HTTP '+response.status));return data}
function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '$'+Number(v||0).toFixed(4)}
function currentModel(){return state.models.find(model=>String(model.id)===String($('modelSelect').value))}
function modelsForMode(){return state.models.filter(model=>model.capability===(state.mode==='image'?'image_generation':'video_generation')).sort((a,b)=>Number(!!a.constraints?.requires_image)-Number(!!b.constraints?.requires_image)||String(a.display_name||a.model_id).localeCompare(String(b.display_name||b.model_id),'zh-CN'))}
function showMessage(text,type='err'){const node=$('message');node.textContent=text||'';node.className='composer-message'+(text?' '+type:'')}
function showCredentialMessage(text,type='err'){const node=$('credentialMessage');node.textContent=text||'';node.className='credential-message'+(text?' '+type:'')}
function replaceOptions(select,values,fallback,suffix=''){const previous=select.value;const list=Array.isArray(values)&&values.length?values:fallback;select.innerHTML=list.map(value=>`<option value="${escapeHTML(value)}">${escapeHTML(value)}${suffix}</option>`).join('');if(list.map(String).includes(previous))select.value=previous}
function priceForModel(model){if(!model)return 0;const pricing=model.pricing||{},resolution=$('resolutionSelect').value,unit=Number((pricing.resolutions&&pricing.resolutions[resolution])||pricing.fixed||0),quantity=state.mode==='image'?Number($('countSelect').value||1):Number($('durationInput').value||1);let total=unit*quantity;if(state.mode==='image'&&state.reference)total+=Number(pricing.input_image||0);return Math.round(total*10000)/10000}
function updateEstimate(){const model=currentModel(),constraints=model?.constraints||{},supportsEdit=!!constraints.supports_edit,requiresImage=!!constraints.requires_image&&!state.reference,invalidEdit=state.mode==='image'&&state.reference&&!supportsEdit;$('priceValue').textContent=money(priceForModel(model));$('submitBtn').title=state.mode==='video'?'生成视频':state.reference?'编辑图片':'生成图片';$('submitBtn').setAttribute('aria-label',$('submitBtn').title);$('submitBtn').disabled=!model||invalidEdit||requiresImage;if(invalidEdit)showMessage('当前模型不支持图片编辑，请移除参考图或更换模型');else if(requiresImage)showMessage('该模型仅支持图片编辑，请上传参考图');else if($('message').textContent.startsWith('当前模型')||$('message').textContent.startsWith('该模型'))showMessage('')}
function syncModelControls(){const model=currentModel(),constraints=model?.constraints||{};if(!model){const missing=state.credentials.some(item=>!item.configured);$('modelHealth').textContent='不可用';$('modelHealth').style.color='var(--warning)';showMessage(missing?'配置 API Key 后显示账号池模型':'当前模式暂无可用模型');$('submitBtn').disabled=true;$('priceValue').textContent='$0.0000';return}const accounts=Number(model.available_accounts||0);$('modelHealth').textContent=accounts>0?accounts+' 个账号':'可用';$('modelHealth').style.color='var(--success)';replaceOptions($('ratioSelect'),constraints.aspect_ratios,state.mode==='image'?['1:1','16:9','9:16','4:3','3:4']:['16:9','9:16','1:1']);replaceOptions($('resolutionSelect'),constraints.resolutions,state.mode==='image'?['1k','2k']:['480p','720p']);if(state.mode==='image'){const count=Math.max(1,Math.min(10,Number(constraints.max_images||4))),current=Math.max(1,Number($('countSelect').value||1));$('countSelect').innerHTML=Array.from({length:count},(_,index)=>`<option value="${index+1}">${index+1}x</option>`).join('');$('countSelect').value=String(Math.min(current,count))}else{const min=Math.max(1,Number(constraints.duration_min||1)),max=Math.max(min,Number(constraints.duration_max||15)),current=Math.max(min,Math.min(max,Number($('durationInput').value||8)));$('durationInput').innerHTML=Array.from({length:max-min+1},(_,index)=>`<option value="${min+index}">${min+index}s</option>`).join('');$('durationInput').value=String(current)}state.uploadLimitMB=Math.max(1,Math.min(5,Number(constraints.max_upload_mb||5)));updateEstimate()}
function fillModels(preferredProviderID=0){const available=modelsForMode(),previous=$('modelSelect').value;$('modelSelect').innerHTML=available.map(model=>`<option value="${model.id}">${escapeHTML(model.display_name||model.model_id)}</option>`).join('')||'<option value="">暂无可用模型</option>';const preferred=available.find(model=>Number(model.provider_id)===Number(preferredProviderID));if(preferred)$('modelSelect').value=String(preferred.id);else if(available.some(model=>String(model.id)===previous))$('modelSelect').value=previous;syncModelControls()}
function clearResultURLs(){for(const url of state.resultURLs)URL.revokeObjectURL(url);state.resultURLs=[]}
function resetResult(){clearTimeout(state.pollTimer);clearResultURLs();state.resultJob=null;$('resultState').classList.add('hidden');$('emptyState').classList.remove('hidden');$('resultMedia').innerHTML='';$('resultIndex').textContent=''}
function setMode(mode){state.mode=mode==='video'?'video':'image';document.querySelectorAll('[data-mode]').forEach(button=>{const active=button.dataset.mode===state.mode;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active))});$('countField').classList.toggle('hidden',state.mode==='video');$('durationField').classList.toggle('hidden',state.mode==='image');$('creativePrompt').placeholder=state.mode==='video'?'描述视频画面、动作、镜头和节奏':'描述画面内容、风格和构图';$('emptyTitle').textContent=state.mode==='video'?'描述你的想法，生成一段视频':'描述你的想法，生成一张图片';clearReference();resetResult();showMessage('');fillModels()}
function clearReference(){$('referenceInput').value='';$('referencePreview').removeAttribute('src');$('referenceChip').classList.remove('show');state.reference='';state.referenceName='';updateEstimate()}
function readReference(file){if(!file){clearReference();return}if(!/^image\/(png|jpeg|webp)$/i.test(file.type)){showMessage('请选择 PNG、JPEG 或 WebP 图片');clearReference();return}if(file.size>state.uploadLimitMB*1024*1024){showMessage('参考图片不能超过 '+state.uploadLimitMB+'MB');clearReference();return}const reader=new FileReader();reader.onload=()=>{state.reference=String(reader.result);state.referenceName=file.name;$('referencePreview').src=state.reference;$('referenceName').textContent=file.name;$('referenceChip').classList.add('show');showMessage('');updateEstimate()};reader.readAsDataURL(file)}
function requestKey(){return 'web_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)}
function resultStatus(job){return ({created:'排队中',processing:'生成中',completed:'已完成',failed:'生成失败',refunded:'失败已退款'})[job?.status]||job?.status||'处理中'}
function showPending(prompt,label='正在提交创作任务'){resetResult();$('emptyState').classList.add('hidden');$('resultState').classList.remove('hidden');$('resultPrompt').textContent=prompt||'创作结果';$('resultMeta').innerHTML='';$('resultStatus').textContent='处理中';$('resultStatus').className='result-status warn';$('resultMedia').className='result-media';$('resultMedia').innerHTML=`<div class="result-pending"><div class="pending-ring"></div><strong>${escapeHTML(label)}</strong><span>请保持页面打开，完成后会自动显示结果</span><div class="progress-line"><i style="width:8%"></i></div></div>`;$('resultIndex').textContent=''}
function streamURL(job,index=0){const query=new URLSearchParams({index:String(index)});if(state.token)query.set('token',state.token);return `./api/creative/jobs/${job.id}/content?${query.toString()}`}
async function contentURL(job,index){const response=await fetch(streamURL(job,index),{headers:headers(false)});if(!response.ok){const type=response.headers.get('content-type')||'',data=type.includes('json')?await response.json():await response.text();throw new Error((data&&data.error)||data||('HTTP '+response.status))}const url=URL.createObjectURL(await response.blob());state.resultURLs.push(url);return url}
async function renderCompleted(job){clearResultURLs();const count=job.media_type==='image'?Math.max(1,Number(job.content_count||1)):1;if(job.media_type==='video'){$('resultMedia').className='result-media video';$('resultMedia').innerHTML=`<video src="${escapeHTML(streamURL(job,0))}" controls autoplay playsinline preload="metadata"></video>`;$('resultIndex').textContent='视频已完成';return}const urls=await Promise.all(Array.from({length:count},(_,index)=>contentURL(job,index)));$('resultMedia').className='result-media images'+(count>1?' multi':'');$('resultMedia').innerHTML=urls.map((url,index)=>`<div class="media-item"><img src="${url}" alt="${escapeHTML(job.prompt||'生成图片')}"/><div class="media-actions"><a href="${url}" target="_blank" rel="noopener" title="打开原图" aria-label="打开原图"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a><a href="${url}" download="creative-${job.id}-${index+1}.png" title="下载图片" aria-label="下载图片"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></div>`).join('');$('resultMedia').scrollLeft=0;requestAnimationFrame(()=>$('resultMedia').scrollLeft=0);$('resultIndex').textContent=count>1?`共 ${count} 张图片`:'图片 1'}
async function presentJob(job){state.resultJob=job;$('emptyState').classList.add('hidden');$('resultState').classList.remove('hidden');$('resultPrompt').textContent=job.prompt||'创作结果';$('resultMeta').innerHTML=`<span>${escapeHTML(job.model_id||currentModel()?.display_name||'')}</span><span>${money(job.charge_amount)}</span>`;$('resultStatus').textContent=resultStatus(job);$('resultStatus').className='result-status '+(job.status==='completed'?'ok':job.status==='failed'||job.status==='refunded'?'bad':'warn');if(job.status==='completed'){await renderCompleted(job);return}if(job.status==='failed'||job.status==='refunded'){$('resultMedia').className='result-media';$('resultMedia').innerHTML=`<div class="result-error">${escapeHTML(job.error_message||'生成失败，请调整参数后重试')}</div>`;$('resultIndex').textContent='';return}const progress=Math.max(2,Math.min(100,Number(job.progress||0)));$('resultMedia').className='result-media';$('resultMedia').innerHTML=`<div class="result-pending"><div class="pending-ring"></div><strong>${escapeHTML(resultStatus(job))}</strong><span>视频生成通常需要一些时间，完成后会自动播放</span><div class="progress-line"><i style="width:${progress}%"></i></div></div>`;$('resultIndex').textContent=progress+'%';clearTimeout(state.pollTimer);state.pollTimer=setTimeout(()=>pollJob(job.id),4000)}
async function pollJob(id){if(Number(state.resultJob?.id)!==Number(id))return;try{const job=await api(`./api/creative/jobs/${id}`);if(Number(state.resultJob?.id)!==Number(id))return;await presentJob(job)}catch(error){if(Number(state.resultJob?.id)!==Number(id))return;showMessage(error.message);state.pollTimer=setTimeout(()=>pollJob(id),6000)}}
async function submitCreation(){const model=currentModel(),prompt=$('creativePrompt').value.trim();if(!model)throw new Error('暂无可用模型');if(!prompt&&!(state.mode==='video'&&state.reference))throw new Error('请输入提示词');const button=$('submitBtn');button.disabled=true;showMessage('');showPending(prompt,state.mode==='image'?'正在生成图片':'正在提交视频任务');try{let job;if(state.mode==='image')job=await api('./api/creative/images',{method:'POST',body:JSON.stringify({model_id:Number(model.id),prompt,n:Number($('countSelect').value),aspect_ratio:$('ratioSelect').value,resolution:$('resolutionSelect').value,image_data_url:state.reference,request_key:requestKey()})});else job=await api('./api/creative/videos',{method:'POST',body:JSON.stringify({model_id:Number(model.id),prompt,duration:Number($('durationInput').value),aspect_ratio:$('ratioSelect').value,resolution:$('resolutionSelect').value,image_data_url:state.reference,request_key:requestKey()})});await presentJob(job);showMessage(state.mode==='image'?'图片生成完成':'视频任务已提交','ok');clearReference();await loadOptions()}catch(error){resetResult();showMessage(error.message);throw error}finally{button.disabled=false;updateEstimate()}}
function renderCredentials(){const list=$('credentialList'),button=$('credentialBtn'),text=$('credentialBtnText');if(!state.credentials.length){button.classList.add('hidden');list.innerHTML='';return}button.classList.remove('hidden');const configured=state.credentials.filter(item=>item.configured).length,ready=state.credentials.every(item=>item.encryption_ready);button.classList.toggle('ok',ready&&configured===state.credentials.length);text.textContent=!ready?'Key 未启用':configured===state.credentials.length?'Key 已配置':'配置 API Key';list.innerHTML=state.credentials.map(item=>`<div class="credential-item" data-credential-provider="${Number(item.provider_id)}"><div class="credential-meta"><strong>${escapeHTML(item.provider_name||'Sub2API 账号池')}</strong><span>${item.configured?escapeHTML(item.key_hint||'已保存'):'未配置'}</span></div><div class="credential-controls"><input type="password" autocomplete="new-password" maxlength="4096" placeholder="${item.configured?'输入新 Key 可替换':'输入 Sub2API API Key'}" ${item.encryption_ready?'':'disabled'}/><button type="button" data-credential-save ${item.encryption_ready?'':'disabled'}>保存并验证</button>${item.configured?'<button type="button" class="secondary" data-credential-delete>删除</button>':''}</div></div>`).join('');list.querySelectorAll('[data-credential-save]').forEach(save=>save.onclick=()=>saveCredential(Number(save.closest('[data-credential-provider]').dataset.credentialProvider)).catch(error=>showCredentialMessage(error.message)));list.querySelectorAll('[data-credential-delete]').forEach(remove=>remove.onclick=()=>deleteCredential(Number(remove.closest('[data-credential-provider]').dataset.credentialProvider)).catch(error=>showCredentialMessage(error.message)))}
async function saveCredential(providerID){const row=document.querySelector(`[data-credential-provider="${providerID}"]`),input=row?.querySelector('input'),button=row?.querySelector('[data-credential-save]'),apiKey=(input?.value||'').trim();if(apiKey.length<8)throw new Error('请输入有效的 API Key');button.disabled=true;showCredentialMessage('');try{await api('./api/creative/credentials',{method:'PUT',body:JSON.stringify({provider_id:providerID,api_key:apiKey})});input.value='';await loadOptions(providerID);showCredentialMessage('API Key 已保存并通过验证','ok')}finally{button.disabled=false}}
async function deleteCredential(providerID){if(!confirm('确定删除这个 API Key 吗？'))return;await api('./api/creative/credentials?provider_id='+encodeURIComponent(providerID),{method:'DELETE'});await loadOptions();showCredentialMessage('API Key 已删除','ok')}
async function loadOptions(preferredProviderID=0){const data=await api('./api/creative/options');state.models=Array.isArray(data.models)?data.models:[];state.credentials=Array.isArray(data.credentials)?data.credentials:[];$('balanceBadge').innerHTML='<span class="balance-label">余额&nbsp;</span>'+money(data.balance);document.querySelectorAll('.nav-extra').forEach(link=>link.style.display=data.is_admin?'flex':'none');renderCredentials();fillModels(preferredProviderID)}
function applyTheme(){const light=document.documentElement.classList.contains('light'),label=$('themeBtn').querySelector('.theme-label');if(label)label.textContent=light?'深色':'浅色';$('themeBtn').title=light?'切换为深色':'切换为浅色';$('favicon').href=light?'./assets/creative-icon-app-light.svg':'./assets/creative-icon-app.svg'}
function initTheme(){let light=false;try{light=(localStorage.getItem('sub2api_ext_theme')||'')==='light'}catch{}document.documentElement.classList.toggle('light',light);applyTheme()}
function wireInternalLinks(){document.querySelectorAll('a[href^="./"]').forEach(link=>link.addEventListener('click',event=>{if(!state.token)return;const href=link.getAttribute('href')||'';if(href.includes('token='))return;event.preventDefault();const target=new URL(href,location.href);target.searchParams.set('token',state.token);location.href=target.pathname+target.search+target.hash}))}
$('themeBtn').onclick=()=>{const light=!document.documentElement.classList.contains('light');document.documentElement.classList.toggle('light',light);try{localStorage.setItem('sub2api_ext_theme',light?'light':'dark')}catch{}applyTheme()};
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>setMode(button.dataset.mode));$('creativePrompt').oninput=()=>{$('promptCount').textContent=$('creativePrompt').value.length+' / 4000';$('creativePrompt').style.height='auto';$('creativePrompt').style.height=Math.min(190,$('creativePrompt').scrollHeight)+'px'};$('modelSelect').onchange=syncModelControls;[$('ratioSelect'),$('resolutionSelect'),$('countSelect'),$('durationInput')].forEach(node=>node.onchange=updateEstimate);$('referenceInput').onchange=()=>readReference($('referenceInput').files[0]);$('removeReference').onclick=clearReference;$('submitBtn').onclick=()=>submitCreation().catch(()=>{});$('credentialBtn').onclick=()=>{$('credentialDialog').showModal();showCredentialMessage('')};$('closeCredential').onclick=()=>$('credentialDialog').close();$('credentialDialog').onclick=event=>{if(event.target===$('credentialDialog'))$('credentialDialog').close()};window.addEventListener('beforeunload',()=>{clearTimeout(state.pollTimer);clearResultURLs()});
initTheme();state.token=findToken();wireInternalLinks();if(!state.token){showMessage('请先登录 Sub2API 后再打开创作页面')}else{loadOptions().then(()=>{if(location.hash==='#credentials'&&!$('credentialBtn').classList.contains('hidden'))$('credentialBtn').click()}).catch(error=>showMessage(error.message))}
</script>
</body>
