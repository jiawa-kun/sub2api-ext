<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务中心 · Sub2API 扩展</title>
  <link rel="icon" type="image/svg+xml" href="./assets/tasks-icon-app.svg" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="./assets/tasks-icon-app-light.svg" media="(prefers-color-scheme: light)" />
  <link id="favicon" rel="icon" type="image/svg+xml" href="./assets/tasks-icon-app.svg" />
  <style>
:root {
  --bg0:#070b16; --bg1:#121a2f; --card:rgba(18,26,43,.92); --text:#eef3ff; --muted:#93a0b8;
  --primary:#5b8cff; --primary2:#7c5cff; --ok:#22c55e; --danger:#f43f5e; --warn:#f59e0b;
  --border:rgba(255,255,255,.09); --soft:rgba(255,255,255,.04); --soft2:rgba(255,255,255,.07);
  --shadow:0 16px 40px rgba(0,0,0,.28); --glow:rgba(91,140,255,.28);
  --radius:18px; --radius-sm:12px;
}
html.light {
  --bg0:#eef2ff; --bg1:#f8fafc; --card:rgba(255,255,255,.96); --text:#0f172a; --muted:#64748b;
  --border:rgba(15,23,42,.08); --soft:rgba(15,23,42,.03); --soft2:rgba(15,23,42,.06);
  --shadow:0 12px 30px rgba(15,23,42,.08); --glow:rgba(59,130,246,.16);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 420px at 10% -12%, var(--glow), transparent 58%),
    radial-gradient(720px 340px at 100% 0%, rgba(124,92,255,.14), transparent 52%),
    linear-gradient(180deg,var(--bg0),var(--bg1));
  display:flex; justify-content:center; padding:16px 14px 40px;
}
.wrap{width:min(720px,100%); display:flex; flex-direction:column; gap:12px}
a{color:var(--primary); text-decoration:none}
.top{
  display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 14px 12px;
}
.topnav{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px}
.topnav a{
  text-decoration:none; color:var(--text); font-size:.78rem; font-weight:650;
  border:1px solid var(--border); border-radius:999px; padding:6px 10px 6px 8px; background:var(--soft);
  display:inline-flex; align-items:center; gap:6px;
}
.topnav a svg{width:14px; height:14px; flex:none; opacity:.9}
.topnav a.active{border-color:rgba(91,140,255,.45); background:rgba(91,140,255,.12); color:#9db7ff}
html.light .topnav a.active{color:#4f46e5}
.topnav a.nav-extra{display:none}
.brand-title{display:flex; align-items:center; gap:10px}
.brand-title .logo{width:34px; height:34px; border-radius:10px; flex:none}
.brand-title .logo.dark{display:block}
.brand-title .logo.light{display:none}
html.light .brand-title .logo.dark{display:none}
html.light .brand-title .logo.light{display:block}
.brand-title h1{margin:0; font-size:1.22rem}
.lead{margin:6px 0 0; color:var(--muted); font-size:.82rem; line-height:1.45}
.top-meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end}
.theme-btn,.ghost-btn{
  border:1px solid var(--border); background:var(--soft2); color:var(--text);
  border-radius:999px; padding:5px 10px; font-size:.72rem; font-weight:650; cursor:pointer;
}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px;
}
.card.loading{opacity:.72; pointer-events:none}
.pool-feature{display:none}
.pool-feature.show{display:block}
.pool-feature .task{margin:0;box-shadow:var(--shadow);background:var(--card);border-color:rgba(34,197,94,.25)}
.msg{display:none; margin-bottom:10px; padding:8px 10px; border-radius:10px; font-size:.8rem}
.msg.show{display:block}
.msg.ok{background:rgba(34,197,94,.12); color:var(--ok)}
.msg.err{background:rgba(244,63,94,.12); color:var(--danger)}
.task{
  border:1px solid var(--border); border-radius:14px; padding:12px 12px 10px; background:var(--soft);
  display:flex; flex-direction:column; gap:8px; margin-bottom:10px;
}
.task-head{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.task-title{font-weight:700; font-size:.95rem}
.task-desc{color:var(--muted); font-size:.78rem; line-height:1.4}
.task-meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:.75rem; color:var(--muted)}
.pill{
  border:1px solid var(--border); border-radius:999px; padding:3px 8px; background:var(--soft2);
  font-weight:650; color:var(--text);
}
.pill.ok{border-color:rgba(34,197,94,.35); color:var(--ok)}
.pill.warn{border-color:rgba(245,158,11,.35); color:var(--warn)}
.bar{height:8px; border-radius:999px; background:var(--soft2); overflow:hidden}
.bar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--primary2))}
.btn{
  border:0; border-radius:999px; padding:7px 12px; font-size:.78rem; font-weight:700; cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff;
}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.secondary{background:var(--soft2); color:var(--text); border:1px solid var(--border)}
.empty{text-align:center; color:var(--muted); padding:28px 8px; font-size:.86rem}
.pool-feature .task.pool-task{
  position:relative; overflow:hidden; gap:12px; padding:14px 14px 12px;
  border:1px solid rgba(34,197,94,.32);
  background:
    radial-gradient(520px 180px at 100% 0%, rgba(34,197,94,.16), transparent 60%),
    radial-gradient(420px 160px at 0% 100%, rgba(91,140,255,.12), transparent 55%),
    var(--card);
}
.pool-feature .task.pool-task::before{
  content:""; position:absolute; inset:0 auto 0 0; width:4px;
  background:linear-gradient(180deg,#22c55e,#5b8cff); border-radius:14px 0 0 14px;
}
.pool-kicker{
  display:inline-flex; align-items:center; gap:6px; margin-bottom:4px;
  padding:3px 9px; border-radius:999px; font-size:.68rem; font-weight:800; letter-spacing:.02em;
  color:#166534; background:rgba(34,197,94,.16); border:1px solid rgba(34,197,94,.28);
}
html:not(.light) .pool-kicker{color:#86efac}
.pool-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pool-task .task-title{font-size:1.08rem; letter-spacing:.01em}
.pool-task .task-desc{margin-top:4px; font-size:.84rem; color:var(--text); opacity:.88; font-weight:600}
.pool-task .btn{min-width:118px; padding:9px 14px; font-size:.82rem; box-shadow:0 8px 18px rgba(34,197,94,.18)}
.pool-task .btn:disabled{box-shadow:none}
.pool-stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.pool-stat{
  border:1px solid var(--border); border-radius:12px; padding:10px 12px;
  background:rgba(255,255,255,.04);
}
html.light .pool-stat{background:rgba(15,23,42,.03)}
.pool-stat .k{font-size:.7rem; color:var(--muted); font-weight:650}
.pool-stat .v{margin-top:4px; font-size:1.05rem; font-weight:800; color:var(--ok); letter-spacing:.01em}
.pool-stat .v.muted{color:var(--muted); font-size:.88rem; font-weight:700}
.pool-stat.recover .v{color:var(--warn)}
.pool-stat .action{margin-top:8px}
.pool-highlights{display:flex; flex-wrap:wrap; gap:8px}
.pool-chip{
  display:inline-flex; align-items:center; gap:6px;
  border-radius:999px; padding:7px 11px; font-size:.76rem; font-weight:750; line-height:1.2;
  border:1px solid rgba(91,140,255,.28); background:rgba(91,140,255,.12); color:var(--text);
}
.pool-chip strong{color:#93c5fd; font-weight:800}
html.light .pool-chip strong{color:#2563eb}
.pool-chip.accent{
  border-color:rgba(34,197,94,.35); background:rgba(34,197,94,.14);
}
.pool-chip.accent strong{color:#86efac}
html.light .pool-chip.accent strong{color:#15803d}
.pool-chip.warn{
  border-color:rgba(245,158,11,.35); background:rgba(245,158,11,.12);
}
.pool-chip.warn strong{color:#fbbf24}
html.light .pool-chip.warn strong{color:#b45309}
.pool-rules{margin-top:2px; border-top:1px dashed var(--border); padding-top:8px}
.pool-rules > summary{
  list-style:none; cursor:pointer; user-select:none;
  display:inline-flex; align-items:center; gap:6px;
  color:var(--muted); font-size:.75rem; font-weight:700;
}
.pool-rules > summary::-webkit-details-marker{display:none}
.pool-rules > summary::after{content:"▾"; font-size:.7rem; opacity:.75}
.pool-rules[open] > summary::after{content:"▴"}
.pool-rules[open] > summary{margin-bottom:8px; color:var(--text)}
.pool-rules-list{display:grid; gap:4px; margin:0; padding:0; list-style:none; color:var(--muted); font-size:.72rem; line-height:1.45}
@media (max-width:520px){
  .pool-stats{grid-template-columns:1fr}
  .pool-task .btn{min-width:0}
}
  </style>

  <script>
  (function(){
    const params = new URLSearchParams(location.search);
    const el = id => document.getElementById(id);
    const THEME_KEY='sub2api_ext_theme';
    let accessToken = '';

    function cleanToken(v){
      v = String(v||'').trim();
      if(!v) return '';
      if(/^bearer\s+/i.test(v)) v=v.replace(/^bearer\s+/i,'');
      return v.trim();
    }
    function readStorage(k){
      try{ return localStorage.getItem(k)||''; }catch{ return ''; }
    }
    function storeToken(t){
      if(!t) return;
      try{ localStorage.setItem('auth_token', t); }catch{}
      try{
        if(window.parent && window.parent !== window){
          window.parent.localStorage.setItem('auth_token', t);
        }
      }catch{}
    }
    function cleanTokenQuery(){
      if(!params.has('token')) return;
      params.delete('token');
      try{
        const q=params.toString();
        history.replaceState(null,'',location.pathname+(q?'?'+q:'')+location.hash);
      }catch{}
    }
    function pickToken(){
      const q = cleanToken(params.get('token')||'');
      if(q){
        storeToken(q);
        cleanTokenQuery();
        return q;
      }
      const keys=['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];
      for(const k of keys){
        const v = cleanToken(readStorage(k));
        if(v && v.split('.').length===3) return v;
      }
      try{
        if(window.parent && window.parent !== window){
          for(const k of keys){
            const v = cleanToken(window.parent.localStorage.getItem(k)||'');
            if(v && v.split('.').length===3) return v;
          }
        }
      }catch{}
      return '';
    }
    function authHeaders(){
      const h = {'Accept':'application/json','Content-Type':'application/json'};
      if(accessToken){
        h['Authorization'] = 'Bearer '+accessToken;
        h['X-User-Token'] = accessToken;
      }
      return h;
    }
    async function api(path, opts={}){
      const res = await fetch(path, {...opts, headers:Object.assign(authHeaders(), opts.headers||{})});
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error||data.message||('HTTP '+res.status));
      return data;
    }
    function showMsg(text, type){
      const m = el('msg');
      if(!text){ m.className='msg'; m.textContent=''; return; }
      m.textContent = text;
      m.className = 'msg show '+(type||'');
    }
    function applyFavicon(light){
      const link = document.getElementById('favicon');
      if(link) link.href = light ? './assets/tasks-icon-app-light.svg' : './assets/tasks-icon-app.svg';
    }
    function initTheme(){
      const q=(params.get('theme')||'').toLowerCase();
      let saved='';
      try{ saved=localStorage.getItem(THEME_KEY)||''; }catch{}
      const light=q==='light' || (!q && saved==='light');
      document.documentElement.classList.toggle('light', !!light);
      applyFavicon(!!light);
      const label=document.querySelector('#themeBtn .theme-label');
      if(label) label.textContent = light ? '深色' : '浅色';
    }
    function toggleTheme(){
      const light=!document.documentElement.classList.contains('light');
      document.documentElement.classList.toggle('light', light);
      applyFavicon(light);
      const label=document.querySelector('#themeBtn .theme-label');
      if(label) label.textContent = light ? '深色' : '浅色';
      try{ localStorage.setItem(THEME_KEY, light?'light':'dark'); }catch{}
    }
    function wireInternalNav(){
    }
    function render(data, rewards, pool){
      const items = data.items||[];
      const box = el('list');
      const poolFeature = el('poolFeature');
      const rewardItems = (rewards&&rewards.items||[]).filter(x=>['pending','claimed','success'].includes(String(x.status||'')));
      const rewardHTML = rewardItems.map(r=>{
        const st=String(r.status||'');
        const pending=st==='pending';
        const label=pending?'领取':(st==='claimed'||st==='success'?'已到账':st);
        const expires=r.expires_at?`<span>有效期至 ${escapeHtml(String(r.expires_at).replace('T',' ').slice(0,19))}</span>`:'';
        return `<div class="task" data-reward-batch="${r.batch_id}">
          <div class="task-head">
            <div>
              <div class="task-title">额度回流奖励</div>
              <div class="task-desc">来自闲置额度回流池的活跃用户奖励</div>
            </div>
            <button type="button" class="btn" data-redis-claim="${r.batch_id}" ${pending?'':'disabled'}>${label} ${money(r.planned_amount||r.actual_amount||0)}</button>
          </div>
          <div class="task-meta">
            <span class="${pending?'pill ok':'pill'}">${pending?'待领取':'已处理'}</span>
            <span>批次 #${r.batch_id}</span>
            <span>额度 ${money(r.planned_amount||r.actual_amount||0)}</span>
            ${expires}
          </div>
        </div>`;
      }).join('');
      const recoverable=(pool&&pool.recoverable||[]).reduce((sum,x)=>sum+Number(x.remaining_amount||0),0);
      const today=pool&&pool.today_draw;
      const drawn=!!(today&&today.status==='success');
      const poolHTML=pool?`<div class="task pool-task">
        <div class="task-head">
          <div>
            <div class="pool-kicker">限时福利 · 闲置额度再分配</div>
            <div class="pool-title-row"><div class="task-title">额度回流池</div></div>
            <div class="task-desc">闲置额度进公共池，活跃用户每天抽一次</div>
          </div>
          <button type="button" class="btn" data-pool-draw ${drawn?'disabled':''}>${drawn?'今日已抽 '+money(today.amount):'立即抽取'}</button>
        </div>
        <div class="pool-stats">
          <div class="pool-stat">
            <div class="k">当前池余额</div>
            <div class="v">${money(pool.available_pool)}</div>
          </div>
          <div class="pool-stat${recoverable>0?' recover':''}">
            <div class="k">我的可追回</div>
            <div class="v${recoverable>0?'':' muted'}">${recoverable>0?money(recoverable):'暂无'}</div>
            ${recoverable>0?`<div class="action"><button type="button" class="ghost-btn" data-pool-recover>一键追回</button></div>`:''}
          </div>
        </div>
        ${renderPoolRules(pool.rules, pool.recoverable)}
      </div>`:'';
      if(poolFeature){
        poolFeature.innerHTML=poolHTML;
        poolFeature.classList.toggle('show',!!poolHTML);
      }
      if(!data.enabled){
        box.innerHTML = rewardHTML || '<div class="empty">任务中心已关闭</div>';
        return;
      }
      if(!items.length){
        box.innerHTML = rewardHTML || '<div class="empty">暂无可用任务</div>';
        return;
      }
      box.innerHTML = rewardHTML + items.map(it=>{
        const target = Math.max(1, Number(it.target||1));
        const progress = Math.max(0, Number(it.progress||0));
        const pct = Math.min(100, Math.round(progress/target*100));
        const reward = Number(it.reward||0);
        let status = '进行中';
        let pill = 'pill';
        let rewardText = '';
        let btnLabel = '';
        const can = !!it.can_claim;
        if(it.claimed){
          status='已领取'; pill='pill ok';
          rewardText=`已领 ${money(it.claim_amount||reward)}`;
          btnLabel='已领取';
        } else if(reward <= 0){
          // 默认奖励为 0：只统计进度，不发奖
          if(it.done){ status='已完成（仅进度）'; pill='pill'; }
          else if(progress>0){ status='进行中（仅进度）'; pill='pill warn'; }
          else { status='未开始（仅进度）'; pill='pill'; }
          rewardText='奖励未开启';
          btnLabel='仅进度';
        } else if(it.done){
          status='可领取'; pill='pill ok';
          rewardText=`奖励 ${money(reward)}`;
          btnLabel=`领取 ${money(reward)}`;
        } else if(progress>0){
          status='进行中'; pill='pill warn';
          rewardText=`奖励 ${money(reward)}`;
          btnLabel='未达标';
        } else {
          status='未开始'; pill='pill';
          rewardText=`奖励 ${money(reward)}`;
          btnLabel='未达标';
        }
        return `<div class="task" data-id="${String(it.id||'').replace(/"/g,'')}">
          <div class="task-head">
            <div>
              <div class="task-title">${escapeHtml(it.name||it.id||'')}</div>
              <div class="task-desc">${escapeHtml(it.description||'')}</div>
            </div>
            <button type="button" class="btn" data-claim="${escapeHtml(it.id||'')}" ${can?'':'disabled'}>${btnLabel}</button>
          </div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="task-meta">
            <span class="${pill}">${status}</span>
            <span>进度 ${progress}/${target}</span>
            <span>${escapeHtml(rewardText)}</span>
            <span>${escapeHtml(it.period||'')} · ${escapeHtml(it.period_key||'')}</span>
          </div>
        </div>`;
      }).join('');
    }
    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function money(v){ return '$'+Number(v||0).toFixed(4); }
    function formatRule(rule, inactive){
      const days=Number(rule&&rule.days||0);
      const labels={
        no_active_days:'连续 '+days+' 个工作日未登录',
        no_usage_days:'连续 '+days+' 个工作日未消耗额度',
        active_within_days:'最近 '+days+' 个工作日登录过',
        used_within_days:'最近 '+days+' 个工作日消耗过额度'
      };
      return labels[String(rule&&rule.type||'')] || (inactive?'已配置的不活跃条件':'已配置的活跃条件');
    }
    function formatLogic(value){ return value==='all' ? '需同时满足' : '满足任一即可'; }
    function formatDrawRules(rules){
      const draw=rules||{};
      if(draw.draw_mode==='fixed') return '抽取金额：固定 '+money(draw.draw_fixed_amount);
      if(draw.draw_mode==='random') return '抽取金额：随机 '+money(draw.draw_min_amount)+'～'+money(draw.draw_max_amount);
      if(draw.active_share_mode==='usage') return '抽取金额：按活跃用户近期额度消耗占比计算';
      return '抽取金额：按符合条件的活跃用户均分';
    }
    function formatDrawShort(rules){
      const draw=rules||{};
      if(draw.draw_mode==='fixed') return '固定 <strong>'+money(draw.draw_fixed_amount)+'</strong>';
      if(draw.draw_mode==='random') return '随机 <strong>'+money(draw.draw_min_amount)+'～'+money(draw.draw_max_amount)+'</strong>';
      if(draw.active_share_mode==='usage') return '按近期消耗占比分配';
      return '活跃用户均分';
    }
    function formatFrequencyShort(rules){
      if((rules||{}).draw_frequency==='daily') return '每天 <strong>1 次</strong> · 含周末';
      return '按当前规则抽取';
    }
    function formatReclaimRules(rules){
      const r=rules||{};
      let amount='固定回收 '+money(r.reclaim_value);
      if(r.reclaim_mode==='percent') amount='按余额的 '+Number(r.reclaim_value||0)+'% 回收';
      if(r.reclaim_mode==='excess') amount='回收保留额度以上的余额';
      const range=[];
      if(Number(r.reclaim_min_per_user||0)>0) range.push('最低 '+money(r.reclaim_min_per_user));
      if(Number(r.reclaim_max_per_user||0)>0) range.push('最高 '+money(r.reclaim_max_per_user));
      return amount+'；余额至少 '+money(r.reclaim_min_balance)+'，保留 '+money(r.reclaim_reserve_balance)+(range.length?'；'+range.join('，'):'');
    }
    function formatDateTime(value){
      if(!value) return '';
      const d=new Date(value);
      if(Number.isNaN(d.getTime())) return String(value).replace('T',' ').slice(0,19);
      return d.toLocaleString('zh-CN',{hour12:false});
    }
    function earliestExpiry(lots){
      const values=(lots||[]).map(x=>x&&x.expires_at).filter(Boolean).sort();
      return values.length ? formatDateTime(values[0]) : '';
    }
    function renderPoolRules(rules, recoverableLots){
      if(!rules) return '';
      const inactive=(rules.inactive_rules||[]).map(rule=>formatRule(rule,true)).join('、') || '暂无不活跃条件';
      const active=(rules.active_rules||[]).map(rule=>formatRule(rule,false)).join('、') || '暂无活跃条件';
      const frequency=rules.draw_frequency==='daily' ? '每天可抽取一次，周六、周日也可抽取' : '抽取频率以当前页面显示为准';
      const protect=[];
      if(rules.paid_balance_protected) protect.push('存在充值记录的用户不回收');
      if(Number(rules.new_user_protection_days||0)>0) protect.push('新用户保护 '+Number(rules.new_user_protection_days)+' 天');
      const expireDays=Number(rules.pool_expire_days||0);
      const recovery=rules.can_recover_before_expiry
        ? '未被抽取的剩余额度可在自动退还前追回；超过期限后自动退还给原用户'
        : '未被抽取的额度按系统规则自动处理';
      const expiry=earliestExpiry(recoverableLots);
      const chips=[
        `<span class="pool-chip">${formatFrequencyShort(rules)}</span>`,
        `<span class="pool-chip accent">${formatDrawShort(rules)}</span>`,
        expireDays>0
          ? `<span class="pool-chip warn"><strong>${expireDays} 天</strong>未抽完自动退还</span>`
          : `<span class="pool-chip warn">按规则自动退还</span>`
      ];
      if(rules.can_recover_before_expiry){
        chips.push('<span class="pool-chip">被回收可先<strong>追回</strong></span>');
      }
      return `<div class="pool-highlights">${chips.join('')}</div>
      <details class="pool-rules">
        <summary>规则详情（可选看）</summary>
        <ul class="pool-rules-list">
          <li>入池条件：${escapeHtml(inactive)}（${formatLogic(rules.inactive_logic)}）</li>
          ${protect.length?`<li>保护规则：${escapeHtml(protect.join('；'))}</li>`:''}
          <li>回收额度：${escapeHtml(formatReclaimRules(rules))}</li>
          <li>活跃条件：${escapeHtml(active)}（${formatLogic(rules.active_logic)}）</li>
          <li>工作日定义：${escapeHtml(rules.workday_definition||'周一至周五计入工作日；周末不计天数，但周末活动仍有效')}</li>
          <li>${frequency}</li>
          <li>${escapeHtml(formatDrawRules(rules))}</li>
          <li>自动退还：入池后 ${expireDays} 天未被抽取，自动退还给原用户</li>
          <li>${recovery}</li>
          ${expiry?`<li>我的最近自动退还时间：${escapeHtml(expiry)}</li>`:''}
          ${rules.effective_at?`<li>规则更新时间：${escapeHtml(formatDateTime(rules.effective_at))}</li>`:''}
        </ul>
      </details>`;
    }
    async function load(){
      const panel=el('panel');
      panel.classList.add('loading');
      try{
        const [data,rewards,pool] = await Promise.all([
          api('./api/tasks'),
          api('./api/redistribution/rewards').catch(()=>({items:[]})),
          api('./api/redistribution/pool').catch(()=>null)
        ]);
        render(data||{}, rewards||{}, pool);
        showMsg('');
        return true;
      }catch(e){
        el('list').innerHTML = '<div class="empty">加载失败</div>';
        showMsg(String(e.message||e), 'err');
        return false;
      }finally{
        panel.classList.remove('loading');
      }
    }
    async function claim(taskId){
      try{
        const res = await api('./api/tasks/claim', {method:'POST', body: JSON.stringify({task_id: taskId})});
        showMsg(res.status==='already_claimed' ? '已经领取过了' : `领取成功 +${money(res.amount)}`, 'ok');
        await load();
      }catch(e){
        showMsg(String(e.message||e), 'err');
      }
    }
    async function claimRedistribution(batchID){
      try{
        const res = await api('./api/redistribution/rewards/claim', {method:'POST', body: JSON.stringify({batch_id: Number(batchID)})});
        const amount = Number((res.reward&&res.reward.actual_amount)||(res.reward&&res.reward.planned_amount)||0);
        showMsg(`领取成功 +${money(amount)}`, 'ok');
        await load();
      }catch(e){
        showMsg(String(e.message||e), 'err');
      }
    }
    async function drawPool(){
      try{if(!await load()) return;const res=await api('./api/redistribution/pool',{method:'POST',body:'{}'});showMsg(`抽取成功 +${money(res.draw&&res.draw.amount)}`,'ok');await load()}catch(e){showMsg(String(e.message||e),'err')}
    }
    async function recoverPool(){
      try{const res=await api('./api/redistribution/recover',{method:'POST',body:'{}'});const amount=(res.items||[]).reduce((sum,x)=>sum+Number(x.amount||0),0);showMsg(`追回成功 +${money(amount)}`,'ok');await load()}catch(e){showMsg(String(e.message||e),'err')}
    }
    async function resolveIsAdmin(){
      if(!accessToken) return false;
      try{
        const s = await api('./api/status');
        return !!(s && s.is_admin);
      }catch{ return false; }
    }
    function applyNavForRole(isAdmin){
      document.querySelectorAll('.topnav a.nav-extra').forEach(a=>{
        a.style.display = isAdmin ? 'inline-flex' : 'none';
      });
    }

    el('themeBtn').addEventListener('click', toggleTheme);
    el('refreshBtn').addEventListener('click', load);
    el('list').addEventListener('click', (e)=>{
      const b = e.target.closest('[data-claim]');
      const rb = e.target.closest('[data-redis-claim]');
      if(rb && !rb.disabled){ claimRedistribution(rb.dataset.redisClaim); return; }
      if(!b || b.disabled) return;
      claim(b.dataset.claim);
    });
    el('poolFeature').addEventListener('click', (e)=>{
      const draw = e.target.closest('[data-pool-draw]');
      const recover = e.target.closest('[data-pool-recover]');
      if(draw && !draw.disabled){ drawPool(); return; }
      if(recover) recoverPool();
    });

    accessToken = pickToken();
    initTheme();
    wireInternalNav();
    (async function boot(){
      const isAdmin = await resolveIsAdmin();
      applyNavForRole(isAdmin);
      await load();
    })();
  })();
  </script>
</body>
</html>
