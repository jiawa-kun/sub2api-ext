<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>扩展中心 · Sub2API</title>
  <link rel="icon" type="image/svg+xml" href="./assets/ext-center-icon.svg" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="./assets/ext-center-icon-light.svg" media="(prefers-color-scheme: light)" />
  <link id="favicon" rel="icon" type="image/svg+xml" href="./assets/ext-center-icon.svg" />
  <style>
:root {
  --bg0:#070b16; --bg1:#121a2f; --card:rgba(18,26,43,.92); --text:#eef3ff; --muted:#93a0b8;
  --primary:#5b8cff; --primary2:#7c5cff; --ok:#22c55e; --danger:#f43f5e; --warn:#f59e0b;
  --border:rgba(255,255,255,.09); --soft:rgba(255,255,255,.04); --soft2:rgba(255,255,255,.07);
  --shadow:0 16px 40px rgba(0,0,0,.28); --glow:rgba(91,140,255,.28);
  --radius:18px; --radius-sm:12px; --line:rgba(255,255,255,.06);
  --icon-checkin:#5b8cff; --icon-patrol:#22c55e; --icon-admin:#f59e0b; --icon-hub:#7c5cff;
}
html.light {
  --bg0:#eef2ff; --bg1:#f8fafc; --card:rgba(255,255,255,.96); --text:#0f172a; --muted:#64748b;
  --border:rgba(15,23,42,.08); --soft:rgba(15,23,42,.03); --soft2:rgba(15,23,42,.06);
  --shadow:0 12px 30px rgba(15,23,42,.08); --glow:rgba(59,130,246,.16);
  --line:rgba(15,23,42,.06);
  --icon-checkin:#3b82f6; --icon-patrol:#16a34a; --icon-admin:#d97706; --icon-hub:#7c5cff;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 420px at 10% -12%, var(--glow), transparent 58%),
    radial-gradient(720px 340px at 100% 0%, rgba(124,92,255,.14), transparent 52%),
    linear-gradient(180deg,var(--bg0),var(--bg1));
  display:flex; justify-content:center; padding:16px 14px 40px;
}
.wrap{width:min(720px,100%); display:flex; flex-direction:column; gap:12px}
a{color:var(--primary); text-decoration:none}
.brand-banner{
  position:relative; overflow:hidden; border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:var(--shadow); background:var(--card);
}
.brand-banner img{
  display:block; width:100%; height:auto; vertical-align:middle;
}
.brand-banner .banner-dark{display:block}
.brand-banner .banner-light{display:none}
html.light .brand-banner .banner-dark{display:none}
html.light .brand-banner .banner-light{display:block}
.top{
  display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 16px 14px;
}
.brand-title{
  display:flex; align-items:center; gap:10px; margin:0;
}
.brand-title .logo{
  width:36px; height:36px; border-radius:10px; flex:none;
  box-shadow:0 6px 16px rgba(91,140,255,.22);
}
.brand-title .logo.dark{display:block}
.brand-title .logo.light{display:none}
html.light .brand-title .logo.dark{display:none}
html.light .brand-title .logo.light{display:block}
.brand-title h1{margin:0; font-size:1.28rem; letter-spacing:.2px}
.topnav{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px}
.topnav a{
  text-decoration:none; color:var(--text); font-size:.78rem; font-weight:650;
  border:1px solid var(--border); border-radius:999px; padding:6px 10px 6px 8px; background:var(--soft);
  display:inline-flex; align-items:center; gap:6px;
}
.topnav a svg{width:14px; height:14px; flex:none; opacity:.9}
.topnav a.active{border-color:rgba(91,140,255,.45); background:rgba(91,140,255,.12); color:#9db7ff}
html.light .topnav a.active{color:#4f46e5}
.topnav a.nav-extra{display:none}
.lead{margin:6px 0 0; color:var(--muted); font-size:.84rem; line-height:1.45}
.top-meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end}
.theme-btn,.chip{
  border:1px solid var(--border); background:var(--soft2); color:var(--text);
  border-radius:999px; padding:5px 10px; font-size:.72rem; font-weight:650; cursor:pointer;
}
.chip{cursor:default; color:var(--muted)}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px;
}
.card-head{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:12px}
.card-head h2{margin:0; font-size:1rem}
.card-head .desc{margin:4px 0 0; color:var(--muted); font-size:.8rem}
.hero{
  border-radius:14px; padding:12px 14px; margin-bottom:12px;
  background:linear-gradient(135deg, rgba(91,140,255,.15), rgba(124,92,255,.08));
  border:1px solid rgba(91,140,255,.18);
}
.hero .k{font-size:.72rem; color:var(--muted)}
.hero .v{margin-top:4px; font-size:1.05rem; font-weight:750}
.list{display:flex; flex-direction:column; gap:10px}
.mod{
  border:1px solid var(--border); border-radius:14px; padding:12px 13px; background:var(--soft);
}
.mod .row{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.mod .title-line{display:flex; align-items:center; gap:10px; min-width:0}
.mod-icon{
  width:36px; height:36px; border-radius:11px; flex:none;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border); background:var(--soft2);
}
.mod-icon svg{width:18px; height:18px}
.mod-icon.checkin{color:var(--icon-checkin); background:rgba(91,140,255,.12); border-color:rgba(91,140,255,.22)}
.mod-icon.patrol{color:var(--icon-patrol); background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.22)}
.mod-icon.admin{color:var(--icon-admin); background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.22)}
.mod-icon.default{color:var(--icon-hub); background:rgba(124,92,255,.12); border-color:rgba(124,92,255,.22)}
.mod h3{margin:0; font-size:.95rem}
.mod p{margin:8px 0 0; color:var(--muted); font-size:.82rem; line-height:1.45}
.badge{
  flex:none; font-size:.68rem; font-weight:700; border-radius:999px; padding:3px 8px;
  border:1px solid var(--border); color:var(--muted); background:rgba(127,127,127,.08);
}
.badge.on{color:var(--ok); border-color:rgba(34,197,94,.28); background:rgba(34,197,94,.1)}
.badge.off{color:var(--warn); border-color:rgba(245,158,11,.28); background:rgba(245,158,11,.1)}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tag{font-size:.68rem; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:2px 7px}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.actions a{
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:10px; padding:8px 12px; font-size:.8rem; font-weight:700;
  border:1px solid var(--border); color:var(--text); background:var(--soft2);
}
.actions a.primary{
  color:#fff; border:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 8px 18px rgba(91,140,255,.22);
}
.actions a.ghost{opacity:.95}
.msg{margin-top:10px; padding:8px 10px; border-radius:10px; display:none; font-size:.84rem}
.msg.show{display:block}
.msg.err{background:rgba(244,63,94,.12); color:var(--danger)}
.msg.ok{background:rgba(34,197,94,.12); color:var(--ok)}
.foot{margin-top:4px; color:var(--muted); font-size:.74rem; line-height:1.45}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.78em}
@media (max-width:560px){
  .brand-banner{border-radius:14px}
  .brand-title .logo{width:30px; height:30px; border-radius:8px}
  .brand-title h1{font-size:1.12rem}
}
  </style>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body class="app-page app-home">

          </a>
          <a href="./tasks.html" data-nav>

        </div>
        <div class="brand-title">
          <img class="logo dark" src="./assets/ext-center-icon.svg" alt="" width="36" height="36" />

        <div class="k">产品标识</div>

      </div>
      <div class="list" id="list">
        <div class="mod">
          <div class="row">
            <div class="title-line">
              <span class="mod-icon default" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="13" y="4" width="7" height="7" rx="2" fill="currentColor" opacity=".7"/><rect x="4" y="13" width="7" height="7" rx="2" fill="currentColor" opacity=".7"/><rect x="13" y="13" width="7" height="7" rx="2" fill="currentColor" opacity=".45"/></svg>

      <p class="foot">
        自定义菜单请指向 <code>/ext/</code> 打开签到页。
        若希望侧栏先看模块总览，请用 <code>/ext/home.html</code>。

  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const el = (id) => document.getElementById(id);
    const THEME_KEY = 'sub2api_ext_theme';
    const THEME_KEY_LEGACY = 'sub2api_admin_theme';
    const AUTH_KEYS = ['auth_token','access_token','token','jwt','sub2api_token','sub2api_access_token'];

    const ICONS = {
      checkin: { cls:'checkin', svg:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 8V7a4 4 0 0 1 8 0v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="5" y="8" width="14" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 12v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' },
      'account-patrol': { cls:'patrol', svg:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
      ranking: { cls:'default', svg:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 20V10M12 20V4M18 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' },
      lottery: { cls:'checkin', svg:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l2.5 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' },default: { cls:'default', svg:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="13" y="4" width="7" height="7" rx="2" fill="currentColor" opacity=".7"/><rect x="4" y="13" width="7" height="7" rx="2" fill="currentColor" opacity=".7"/><rect x="13" y="13" width="7" height="7" rx="2" fill="currentColor" opacity=".45"/></svg>' }
    };

    function moduleIcon(id){
      const key = (id||'').toLowerCase();
      if(ICONS[key]) return ICONS[key];
      if(key.includes('checkin') || key.includes('sign')) return ICONS.checkin;
      if(key.includes('patrol') || key.includes('account')) return ICONS['account-patrol'];
      if(key.includes('rank')) return ICONS.ranking || ICONS.default;
      return ICONS.default;
    }

    function cleanToken(raw){
      let t=(raw||'').trim();
      if(/^bearer\s+/i.test(t)) t=t.replace(/^bearer\s+/i,'');
      return t.replace(/^["']|["']$/g,'');
    }
    function storageSet(key, val){
      try{ localStorage.setItem(key, val); }catch{}
      try{
        if(window.parent && window.parent!==window){
          window.parent.localStorage.setItem(key, val);
        }
      }catch{}
    }
    function storageGetAll(key){
      const out=[];
      try{ const v=localStorage.getItem(key); if(v) out.push(v); }catch{}
      try{
        if(window.parent && window.parent!==window){
          const v=window.parent.localStorage.getItem(key);
          if(v) out.push(v);
        }
      }catch{}
      try{ const v=sessionStorage.getItem(key); if(v) out.push(v); }catch{}
      return out;
    }
    function persistAuthFromContext(){
      const cands=[];
      const q=cleanToken(params.get('token')||'');
      if(q) cands.push(q);
      for(const k of AUTH_KEYS){
        for(const raw of storageGetAll(k)){
          const t=cleanToken(raw);
          if(t) cands.push(t);
        }
      }
      const best = cands.find(Boolean) || '';
      if(best) storageSet('auth_token', best);
      return best;
    }
    function keepQuery(href){
      try{
        const u = new URL(href, location.href);
        if(u.origin !== location.origin) return href;
        for(const k of ['token','theme']){
          const v = params.get(k);
          if(v && !u.searchParams.get(k)) u.searchParams.set(k, v);
        }
        const curDir = location.pathname.replace(/[^/]*$/, '');
        let rel;
        if(u.pathname.startsWith(curDir)){
          const rest = u.pathname.slice(curDir.length);
          rel = rest ? './' + rest : './';
        } else {
          rel = u.pathname;
        }
        return rel + u.search + u.hash;
      }catch{ return href; }
    }
    function wireInternalNav(){
      document.querySelectorAll('a[href]').forEach(a=>{
        const href = a.getAttribute('href');
        if(!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
        if(/^https?:/i.test(href)) return;
        a.setAttribute('href', keepQuery(href));
      });
    }
    function applyFavicon(light){
      const link = document.getElementById('favicon');
      if(link) link.href = light ? './assets/ext-center-icon-light.svg' : './assets/ext-center-icon.svg';
    }
    function initTheme(){
      const q=(params.get('theme')||'').toLowerCase();
      let saved='';
      try{ saved=localStorage.getItem(THEME_KEY)||localStorage.getItem(THEME_KEY_LEGACY)||''; }catch{}
      const light = q==='light' || (!q && saved==='light');
      document.documentElement.classList.toggle('light', !!light);
      const b=el('themeBtn');
      if(b) b.textContent = light ? '深色' : '浅色';
      applyFavicon(!!light);
    }
    function toggleTheme(){
      const light = !document.documentElement.classList.contains('light');
      document.documentElement.classList.toggle('light', light);
      try{
        localStorage.setItem(THEME_KEY, light?'light':'dark');
        localStorage.setItem(THEME_KEY_LEGACY, light?'light':'dark');
      }catch{}
      const b=el('themeBtn');
      if(b) b.textContent = light ? '深色' : '浅色';
      applyFavicon(light);
    }

    function showMsg(text, type){
      const m = el('msg');
      m.textContent = text;
      m.className = 'msg show ' + (type||'');
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderModules(data){
      const product = data.product_name || data.product || 'Sub2API 扩展';
      el('product').textContent = data.product || product;
      el('compat').textContent = '项目名：' + (data.compat_name || data.product || 'sub2api-ext') +
        ' · 路径前缀 ' + (data.base_path || '/ext');
      const list = Array.isArray(data.modules) ? data.modules : [];
      if(!list.length){
        el('list').innerHTML = '<div class="mod"><div class="row"><div class="title-line"><span class="mod-icon default" aria-hidden="true">'+ICONS.default.svg+'</span><h3>暂无模块</h3></div><span class="badge off">空</span></div><p>服务未返回可用模块。</p></div>';
        return;
      }
      el('list').innerHTML = list.map(m=>{
        const on = !!(m.enabled !== false && (m.status||'active') !== 'planned');
        const badge = `<span class="badge ${on?'on':'off'}">${on?'已启用':'未启用'}</span>`;
        const tags = (m.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');
        const userHref = m.user_path ? keepQuery(m.user_path) : '';
        const adminHref = m.admin_path ? keepQuery(m.admin_path) : '';
        const enter = userHref
          ? `<a class="primary" href="${userHref}">进入</a>`
          : (adminHref ? `<a class="primary" href="${adminHref}">打开配置</a>` : '');
        const admin = adminHref
          ? `<a class="ghost" href="${adminHref}">管理</a>`
          : '';
        const icon = moduleIcon(m.id);
        return `<div class="mod">
          <div class="row">
            <div class="title-line">
              <span class="mod-icon ${icon.cls}" aria-hidden="true">${icon.svg}</span>
              <h3>${escapeHtml(m.name || m.id || '未命名模块')}</h3>
            </div>
            ${badge}
          </div>
          <p>${escapeHtml(m.description || '')}</p>
          <div class="tags">${tags}</div>
          <div class="actions">${enter}${admin}</div>
        </div>`;
      }).join('');
      wireInternalNav();
    }

    async function load(){
      try{
        const r = await fetch('./api/modules', { credentials:'same-origin' });
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        renderModules(data);
      }catch(e){
        renderModules({
          product: 'sub2api-ext',
          product_name: 'Sub2API 扩展',
          compat_name: 'sub2api-ext',
          base_path: '/ext',
          modules: [{
            id: 'checkin',
            name: '每日签到',
            description: '每日签到领取余额奖励（离线兜底卡片）。',
            user_path: './',
            admin_path: './admin.html',
            enabled: true,
            tags: ['余额', '运营']
          },{
            id: 'account-patrol',
            name: '账号模型巡检',
            description: '按分组定时测活账号模型（离线兜底卡片）。',
            user_path: '',
            admin_path: './admin.html#patrol',
            enabled: true,
            tags: ['账号', '巡检']
          }]
        });
        showMsg('模块列表读取失败，已显示本地兜底入口：' + e.message, 'err');
      }
    }

    persistAuthFromContext();
    initTheme();
    wireInternalNav();
    el('themeBtn').onclick = toggleTheme;
    
    async function resolveIsAdmin(){
      const token = (typeof pickToken==='function' ? pickToken() : '') || '';
      if(!token){
        // try storage keys used by other pages
        try{
          const t = localStorage.getItem('auth_token')||'';
          if(!t) return false;
          const r = await fetch('./api/status', { credentials:'same-origin', headers:{ Authorization:'Bearer '+t, Accept:'application/json' }});
          if(!r.ok) return false;
          const s = await r.json();
          return !!(s && s.is_admin);
        }catch{ return false; }
      }
      try{
        const r = await fetch('./api/status', { credentials:'same-origin', headers:{ Authorization:'Bearer '+token, Accept:'application/json' }});
        if(!r.ok) return false;
        const s = await r.json();
        return !!(s && s.is_admin);
      }catch{ return false; }
    }
    function applyNavForRole(isAdmin){
      document.querySelectorAll('.topnav a.nav-extra').forEach(a=>{
        a.style.display = isAdmin ? 'inline-flex' : 'none';
      });
    }
    (async function bootNav(){ applyNavForRole(await resolveIsAdmin()); })();
    load();
  </script>
</body>
</html>
